# =============================================================================
# Irrigator - Home Assistant package (automations)
# =============================================================================
# Replace `irrigatorF4` below with your device's real MQTT prefix if you
# haven't already done so in packages/irrigator.yaml.
# =============================================================================

automation:
  # Drains sensor.irrigator_command_queue (see the trigger-based sensor of
  # that name in irrigator.yaml) whenever the device is reachable. Two
  # triggers: the online transition itself (fastest path - fires the instant
  # binary_sensor.irrigator_online flips to "on"), and a 30s time_pattern
  # safety net that keeps retrying as long as the device stays online and
  # anything is still queued - this is what makes it "retry periodically
  # until success" rather than a single one-shot flush, so a batch that only
  # partially went out (device drops mid-flush) picks back up on the next
  # tick instead of stranding the rest of the queue forever.
  #
  # Pops exactly one item per loop iteration, immediately after publishing
  # it, and re-checks `binary_sensor.irrigator_online` before every
  # iteration (not just once at the top) - so a disconnect mid-batch stops
  # the loop right there instead of firing the rest of the queue at a device
  # that's no longer listening. Only ever items actually published get
  # popped; nothing is removed from the queue on a guess.
  - alias: "Irrigator - flush pending command queue"
    triggers:
      - trigger: state
        entity_id: binary_sensor.irrigator_online
        to: "on"
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: state
        entity_id: binary_sensor.irrigator_online
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('sensor.irrigator_command_queue', 'items') or []) | length > 0 }}"
    actions:
      - repeat:
          while:
            - condition: state
              entity_id: binary_sensor.irrigator_online
              state: "on"
            - condition: template
              value_template: "{{ (state_attr('sensor.irrigator_command_queue', 'items') or []) | length > 0 }}"
          sequence:
            - variables:
                head: "{{ (state_attr('sensor.irrigator_command_queue', 'items'))[0] }}"
            - action: mqtt.publish
              data:
                topic: "{{ head.topic }}"
                payload: "{{ head.payload }}"
            - event: irrigator_queue_pop
              event_data:
                count: 1

  # Per ha.md preface: settings.json / schedule.json / status are requested
  # from the device via MQTT. Rather than polling on a schedule, this only
  # fires the request when HA doesn't have a representation yet (a virgin
  # package install, or an entity that's genuinely never received a value) -
  # once a representation exists, sensor.irrigator_settings and
  # sensor.irrigator_schedule stay current on their own: settings.json only
  # ever changes via HA (see "republish settings on local helper change"
  # below, since the local rotary/display menu has no settings-editing
  # screens), and schedule.json pushes a fresh copy to `.../schedule` on
  # every change from any source, which sensor.irrigator_schedule is already
  # listening to. sensor.irrigator_status is different - the device only
  # ever pushes to `/status` ~15s after ITS OWN boot or in response to
  # `cmd/status` (not retained), so an HA-only restart while the device
  # stays up would otherwise leave it stuck unavailable/unknown forever.
  #
  # Two triggers, not one: `homeassistant: start` alone misses the case
  # where HA comes up before the device has (re)joined the broker - the
  # check would run, find nothing, and then never run again since it's a
  # one-shot trigger. Also firing on binary_sensor.irrigator_online turning
  # "on" covers that reconnect-after-restart window. Each of the three
  # checks is independent, so a restart that only lost one of them (e.g. a
  # fresh install of just this package's schedule sensor) only re-requests
  # that one.
  - alias: "Irrigator - request data"
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.irrigator_online
        to: "on"
        # Debounced: on weak Wi-Fi the device flaps online/offline every couple minutes, and
        # without this each flap re-triggered the full settings/schedule/status re-download
        # below - redundant MQTT traffic plus a burst of state-changed events that made the HA
        # charts look choppy. Since the retained /online topic is already correct the instant
        # the device reconnects, a transient flap doesn't lose any information here - it's the
        # reconnect-after-a-real-outage case (this trigger's whole reason to exist) that still
        # needs to fire, and that case easily survives a 30s hold.
        # for:
        #   seconds: 30
    actions:
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/settings.json", payload: ""}
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/schedule.json", payload: ""}
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/status", payload: ""}

  # Device -> HA: seeds the Settings-tab helpers from the last settings.json
  # download so the UI reflects reality after a restart. Only fires when a
  # fresh download lands (virgin deploy, or a manual "Refresh From Device"
  # press), so it won't fight an in-progress edit except in that narrow window.
  - alias: "Irrigator - sync device settings to local helpers"
    triggers:
      - trigger: state
        entity_id: sensor.irrigator_settings
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.attributes.zone_names is defined }}"
    actions:
      # Held for the whole sync below - see "Irrigator - republish settings
      # on local helper change" further down, whose trigger list is exactly
      # the input_number/input_text/input_boolean helpers this automation is
      # about to write (including input_number.irrigator_watering_percentage).
      # Without this guard, the first of those writes (the zone-name loop, or
      # the calibration input_numbers right after it) fires that automation
      # mid-sync, which - for schedule_active specifically - reads
      # switch.irrigator_schedule_active for its upload, but this automation
      # only gets to that LAST, so the race uploads its still-stale pre-sync
      # value and overwrites the device's real setting with it (confirmed
      # live: a reboot with the device's real schedule_active:true got a
      # cmd/upload/settings.json with schedule_active:false moments later).
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigator_syncing_from_device
      - repeat:
          for_each: "{{ range(1, 12) | list }}"
          sequence:
            # `| truncate(15, True, '', 0)` is defensive, not expected to ever
            # trigger: input_text.irrigator_zone_N_name has `max: 15` (the
            # firmware's zoneNames buffer is 16 bytes), but nothing upstream
            # actually enforces that on the device-reported name. Without
            # this, a real name >15 chars would throw here and silently
            # abort the rest of this automation run - every zone after it,
            # plus default-duration/calibration/schedule-active/percentage
            # below, would never get synced either.
            - action: input_text.set_value
              target:
                entity_id: "input_text.irrigator_zone_{{ repeat.item }}_name"
              data:
                value: >-
                  {{ ((state_attr('sensor.irrigator_settings', 'zone_names') or {}).get(repeat.item | string, {}).get('name', '#' ~ repeat.item ~ ' (no name)')) | truncate(15, True, '', 0) }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get(repeat.item | string, {}).get('enabled', true) }}
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: "input_boolean.irrigator_zone_{{ repeat.item }}_enabled"
              default:
                - action: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.irrigator_zone_{{ repeat.item }}_enabled"
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_default_manual_duration
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'default_manual_duration') | int(5) }}"
      # valve_current_base_level/pump_current_base_level are deliberately NOT synced to a local
      # helper here - there isn't one. They're device-owned (only cmd/calibrate ever sets them),
      # read-only, and already visible directly via sensor.irrigator_settings' own attributes (this
      # sensor IS the sync target for everything else) and sensor.irrigator_calibration (the live
      # cmd/calibrate response) - see irrigator.yaml.
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_upper_limit
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'upper_limit') | int(200) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_lower_limit
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'lower_limit') | int(40) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_rain_skip_probability
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'rain_skip_probability_percent') | int(70) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_rain_skip_amount
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'rain_skip_amount_mm') | int(4) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigator_weatherapi_key
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'weatherapi_key') | default('') }}"
      # schedule_active is deliberately NOT touched here anymore. It used to
      # be "self-set" via switch.turn_on/off from settings.json's value - but
      # switch.irrigator_schedule_active's turn_on/off PUBLISHES cmd/scheduled
      # back to the device (see irrigator.yaml), so doing it here meant every
      # settings download / reconnect FORCED the device's schedule_active to
      # match the settings.json snapshot. When that snapshot was ever stale or
      # wrong relative to the live device state, the sync "corrected" the
      # device to the wrong value - confirmed live disabling a schedule the
      # user had just enabled (the device reported schedule_active:false in a
      # post-reboot download, and this automation dutifully re-broadcast that
      # false via cmd/scheduled, cementing it). Per the "irrigator-driven, HA
      # is just UI" principle, HA must never write schedule_active back: the
      # switch's `state:` already follows the retained /scheduled echo topic
      # (binary_sensor.irrigator_scheduled_state), which the broker redelivers
      # on every reconnect, so the display stays correct on its own with no
      # write-back. The only case the old self-set covered that this doesn't
      # is a TRUE virgin deploy where /scheduled has never been retained at
      # all - now handled device-side instead: the firmware publishes
      # /scheduled once on boot (enterOperationalMode), so the retained topic
      # exists from first boot without HA ever pushing a value.
      #
      # watering_percentage IS still synced below - but only to a local
      # input_number helper (input_number.set_value writes nothing to the
      # device), so unlike the old schedule_active self-set it can't feed back
      # to the firmware. It's guarded by irrigator_syncing_from_device so this
      # write doesn't re-trigger "republish settings on local helper change".
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigator_watering_percentage
        data:
          value: "{{ state_attr('sensor.irrigator_settings', 'watering_percentage') | int(100) }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigator_syncing_from_device

  # HA -> device: any zone-name / enabled / default-duration edit republishes
  # the FULL settings.json (see script.irrigator_publish_settings for why
  # these fields have no dedicated partial-update MQTT topic). Current-sensor
  # calibration is NOT among these triggers - valve/pump_current_base_level
  # are device-owned (only cmd/calibrate sets them, via the "Irrigator
  # Calibrate" button - see irrigator.yaml), so there's no local helper for
  # them to edit in the first place.
  #
  # Guarded on sensor.irrigator_settings already holding real device data:
  # these helpers are created fresh (at their YAML `initial:` placeholder
  # values) on a virgin deploy, and that creation fires a state-changed
  # event just like a real edit would - without this guard, package install
  # would immediately publish those placeholders over the device's real
  # settings, seconds before "sync device settings to local helpers" (above)
  # would have corrected them. Once sensor.irrigator_settings has ever held
  # real data, this condition is always true (both it and these helpers
  # persist their state across restarts), so it never blocks a genuine edit.
  # `mode: restart` + the delay below debounce rapid-fire edits (e.g. clicking the Watering
  # Percentage stepper five times in a row) into a single publish, 3s after the LAST change rather
  # than one publish per click: each new trigger cancels whatever run is currently waiting/mid-flight
  # and starts a fresh one, so only a run that goes a full 3s without being superseded ever reaches
  # the script.irrigator_publish_settings action - and it reads every helper's state at THAT point
  # (fresh, via states()/state_attr() at execution time), which is necessarily the latest edit's
  # value since any later edit would have restarted it again. This also closes a race the old
  # instant-publish had: two edits landing close together could previously fire two overlapping
  # publishes, the second racing/interleaving with "Irrigator - sync device settings to local
  # helpers" reading state mid-update; `mode: restart` guarantees at most one run of this automation
  # is ever live, so there's nothing left to race. Trade-off: any single edit now takes 3s longer to
  # reach the device than before - fine here since these are all HA-side "settings" (zone names,
  # limits, watering percentage), never anything on the run/stop critical path.
  - alias: "Irrigator - republish settings on local helper change"
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_text.irrigator_zone_1_name
          - input_text.irrigator_zone_2_name
          - input_text.irrigator_zone_3_name
          - input_text.irrigator_zone_4_name
          - input_text.irrigator_zone_5_name
          - input_text.irrigator_zone_6_name
          - input_text.irrigator_zone_7_name
          - input_text.irrigator_zone_8_name
          - input_text.irrigator_zone_9_name
          - input_text.irrigator_zone_10_name
          - input_text.irrigator_zone_11_name
          - input_boolean.irrigator_zone_1_enabled
          - input_boolean.irrigator_zone_2_enabled
          - input_boolean.irrigator_zone_3_enabled
          - input_boolean.irrigator_zone_4_enabled
          - input_boolean.irrigator_zone_5_enabled
          - input_boolean.irrigator_zone_6_enabled
          - input_boolean.irrigator_zone_7_enabled
          - input_boolean.irrigator_zone_8_enabled
          - input_boolean.irrigator_zone_9_enabled
          - input_boolean.irrigator_zone_10_enabled
          - input_boolean.irrigator_zone_11_enabled
          - input_number.irrigator_default_manual_duration
          - input_number.irrigator_upper_limit
          - input_number.irrigator_lower_limit
          - input_number.irrigator_rain_skip_probability
          - input_number.irrigator_rain_skip_amount
          - input_text.irrigator_weatherapi_key
          - input_number.irrigator_watering_percentage
    conditions:
      - condition: template
        value_template: "{{ states('sensor.irrigator_settings') not in ['unknown', 'unavailable'] }}"
      # Skip while "Irrigator - sync device settings to local helpers" (above)
      # is still writing these same helpers from a fresh download - see the
      # guard comment on that automation's first action for why: firing here
      # mid-sync would upload switch.irrigator_schedule_active's stale
      # pre-sync value and clobber the device's real settings.
      - condition: state
        entity_id: input_boolean.irrigator_syncing_from_device
        state: "off"
    actions:
      - delay: "00:00:03"
      - action: script.irrigator_publish_settings

  # Keeps the Schedule tab's two dropdowns in sync with real data:
  # - input_select.irrigator_schedule_picker: one option per current record
  #   ("[<index>] Zone <n> - <name> - <day> <time> - <dur>min", index being
  #   the record's position in sensor.irrigator_schedule's `records` list),
  #   plus "+ Add new". script.irrigator_schedule_save/_delete parse the
  #   leading "[<index>]" back out to know which record to touch.
  # - input_select.irrigator_edit_zone: "<n> - <name>" per zone, so the
  #   editor panel's zone picker always shows live names too.
  # Triggers on both sensors since either a schedule change (new/edited/
  # deleted record) or a settings change (renamed zone) affects the labels.
  # Built via a namespace accumulator + a single trailing `{{ ns.items }}`
  # expression so HA's native-type template rendering hands `set_options`
  # an actual list, not a stringified one - if either dropdown ever shows
  # one garbled option instead of several clean ones, check this first.
  - alias: "Irrigator - rebuild schedule editor dropdown options"
    triggers:
      - trigger: state
        entity_id: sensor.irrigator_schedule
      - trigger: state
        entity_id: sensor.irrigator_settings
    actions:
      - variables:
          zone_names: "{{ state_attr('sensor.irrigator_settings', 'zone_names') or {} }}"
          day_names: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
          records: "{{ state_attr('sensor.irrigator_schedule', 'records') or [] }}"
      - variables:
          zone_options: >-
            {%- set ns = namespace(items=[]) -%}
            {%- for z in range(1, 12) -%}
              {%- set zn = zone_names.get(z | string, {}).get('name', '#' ~ z ~ ' (no name)') -%}
              {%- set ns.items = ns.items + [z ~ ' - ' ~ zn] -%}
            {%- endfor -%}
            {{ ns.items }}
          picker_options: >-
            {%- set ns2 = namespace(items=['+ Add new']) -%}
            {%- for r in records -%}
              {%- set zn = zone_names.get(r.zone | string, {}).get('name', '#' ~ r.zone ~ ' (no name)') -%}
              {%- set label = '[' ~ loop.index0 ~ '] Zone ' ~ r.zone ~ ' - ' ~ zn ~ ' - ' ~ day_names[r.day_of_week - 1] ~ ' ' ~ r.start_time ~ ' - ' ~ r.duration_min ~ 'min' ~ ('' if r.active else ' (paused)') -%}
              {%- set ns2.items = ns2.items + [label] -%}
            {%- endfor -%}
            {{ ns2.items }}
      - action: input_select.set_options
        target:
          entity_id: input_select.irrigator_edit_zone
        data:
          options: "{{ zone_options }}"
      - action: input_select.set_options
        target:
          entity_id: input_select.irrigator_schedule_picker
        data:
          options: "{{ picker_options }}"

  # Loads the record selected in input_select.irrigator_schedule_picker into
  # the editor panel's fields (or resets them to sensible defaults when
  # "+ Add new" is selected, e.g. right after a save/delete resets the
  # picker there). Fires on every picker change, including the automatic
  # reset script.irrigator_schedule_save/_delete does after publishing.
  - alias: "Irrigator - load selected schedule record into editor panel"
    triggers:
      - trigger: state
        entity_id: input_select.irrigator_schedule_picker
    actions:
      - variables:
          picker: "{{ trigger.to_state.state }}"
          idx: "{{ (picker.split(']')[0].split('[')[1] | int) if picker.startswith('[') else -1 }}"
          records: "{{ state_attr('sensor.irrigator_schedule', 'records') or [] }}"
          zone_names: "{{ state_attr('sensor.irrigator_settings', 'zone_names') or {} }}"
          day_names: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
      - if:
          - condition: template
            value_template: "{{ 0 <= idx < (records | length) }}"
        then:
          - variables:
              rec: "{{ records[idx] }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_edit_zone
            data:
              option: >-
                {{ rec.zone ~ ' - ' ~ zone_names.get(rec.zone | string, {}).get('name', '#' ~ rec.zone ~ ' (no name)') }}
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_edit_day
            data:
              option: "{{ day_names[rec.day_of_week - 1] }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.irrigator_edit_start_time
            data:
              time: "{{ rec.start_time }}:00"
          - action: input_number.set_value
            target:
              entity_id: input_number.irrigator_edit_duration_min
            data:
              value: "{{ rec.duration_min }}"
          - if:
              - condition: template
                value_template: "{{ rec.active }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.irrigator_edit_active
            else:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.irrigator_edit_active
        else:
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_edit_zone
            data:
              option: >-
                1 - {{ zone_names.get('1', {}).get('name', '#1 (no name)') }}
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_edit_day
            data:
              option: "Mon"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.irrigator_edit_start_time
            data:
              time: "06:00:00"
          - action: input_number.set_value
            target:
              entity_id: input_number.irrigator_edit_duration_min
            data:
              value: 5
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.irrigator_edit_active

      - name: >-
          {{ ('9. ' ~ (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('9', {}).get('name')) if (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('9', {}).get('name') else 'Irrigator Zone 9' }}
        unique_id: irrigator_switch_zone_9
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 9 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:
          - action: script.irrigator_start
            data: {zone: 9, duration: "{{ states('input_number.irrigator_zone_9_duration') | int(5) }}"}
        turn_off:
          - action: script.irrigator_stop

      - name: >-
          {{ ('10. ' ~ (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('10', {}).get('name')) if (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('10', {}).get('name') else 'Irrigator Zone 10' }}
        unique_id: irrigator_switch_zone_10
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 10 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:
          - action: script.irrigator_start
            data: {zone: 10, duration: "{{ states('input_number.irrigator_zone_10_duration') | int(5) }}"}
        turn_off:

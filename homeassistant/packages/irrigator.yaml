# -----------------------------------------------------------------------
# Scripts - all device writes funnel through these so the JSON contract
# (see src/network/MqttService.cpp / src/main.ino handleMqttCommand) is
# built in exactly one place each.
# -----------------------------------------------------------------------
script:
  irrigator_start:
    alias: "Irrigator: start zone or pump"
    fields:
      zone:
        selector:
          number: {min: 0, max: 11, step: 1}
      duration:
        selector:
          number: {min: 1, max: 120, step: 1}
    sequence:
      - action: mqtt.publish
        data:
          topic: "irrigatorF4/cmd/run"
          payload: "{{ {'zone': zone, 'duration': duration} | tojson }}"

  irrigator_stop:
    alias: "Irrigator: stop current watering"
    sequence:
      - action: mqtt.publish
        data:
          topic: "irrigatorF4/cmd/stop"
          payload: ""

  irrigator_stop_all:
    alias: "Irrigator: stop and clear queue"
    sequence:
      - action: mqtt.publish
        data:
          topic: "irrigatorF4/cmd/stop"
          payload: "all"

  irrigator_request_downloads:
    alias: "Irrigator: request status + settings.json + schedule.json"
    sequence:
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/status", payload: ""}
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/settings.json", payload: ""}
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/schedule.json", payload: ""}

  # Full settings.json replace. Must include every field every time - the
  # firmware fills anything missing with factory defaults (parseSettings()),
  # it does not merge against what's currently on flash. This is the ONLY
  # settings-writing script: the firmware also exposes a narrower
  # cmd/set_calibration topic that merges just the 4 calibration fields
  # server-side, but since this script already has to build a full
  # settings.json for the fields that have no dedicated topic (zone names/
  # enabled, default_manual_duration), routing calibration changes through
  # it too - instead of a second script + a second automation for
  # cmd/set_calibration - is one less thing to maintain for no real loss:
  # both paths depend equally on the local input_number helpers being
  # correct, so the "narrower topic" isn't actually a safety win here.
  irrigator_publish_settings:
    alias: "Irrigator: republish full settings.json"
    sequence:
      - variables:
          zn: >-
            {% set ns = namespace(parts=[]) %}
            {% for z in range(1, 12) %}
              {% set nm = states('input_text.irrigator_zone_' ~ z ~ '_name') | tojson %}
              {% set en = is_state('input_boolean.irrigator_zone_' ~ z ~ '_enabled', 'on') | tojson %}
              {% set ns.parts = ns.parts + ['"' ~ z ~ '":{"name":' ~ nm ~ ',"enabled":' ~ en ~ '}'] %}
            {% endfor %}
            {{ '{' ~ (ns.parts | join(',')) ~ '}' }}
      # zn is already a JSON-object string, not a Python dict, so it can't be
      # embedded via the dict-literal-then-tojson pattern used for the other
      # fields (that would double-encode it as a quoted string). Instead the
      # dict of scalar fields is rendered with tojson, then its closing brace
      # is sliced off and the zone_names text spliced in directly.
      - action: mqtt.publish
        data:
          topic: "irrigatorF4/cmd/upload/settings.json"
          payload: >-
            {% set base = {
              'watering_percentage': states('number.irrigator_watering_percentage') | int(100),
              'schedule_active': is_state('switch.irrigator_schedule_active', 'on'),
              'default_manual_duration': states('input_number.irrigator_default_manual_duration') | int(5),
              'valve_current_zero_offset_mv': states('input_number.irrigator_valve_zero_offset_mv') | int(1650),
              'valve_current_mv_per_ma': states('input_number.irrigator_valve_mv_per_ma') | float(1.0),
              'pump_current_zero_offset_mv': states('input_number.irrigator_pump_zero_offset_mv') | int(1650),
              'pump_current_mv_per_ma': states('input_number.irrigator_pump_mv_per_ma') | float(1.0)
            } %}
            {% set base_json = (base | tojson) %}
            {{ base_json[:-1] ~ ',"zone_names":' ~ zn ~ '}' }}

  # ---------------------------------------------------------------------
  # HA -> device: rebuild schedule.json from the 11 Local Calendar entities
  # and publish it. VERIFY BEFORE RELYING ON: `calendar.get_events`'s exact
  # response shape (assumed here: {"<entity_id>": {"events": [...]}}, each
  # event with `start`/`end`/`summary` keys) couldn't be confirmed against
  # current docs from here - open Developer Tools > Actions, pick
  # "Calendar: Get events", target one calendar, run it, and compare the
  # returned data shown there against the `cal_response` usage below before
  # trusting this in production. If the shape differs, `zone_events` below
  # will end up empty (not crash) - so a shape mismatch fails toward
  # "publishes nothing new" rather than corrupting the schedule, but it also
  # means edits silently stop propagating, so check it once after setup.
  # ---------------------------------------------------------------------
  irrigator_publish_schedule_from_calendars:
    alias: "Irrigator: rebuild + publish schedule.json from Local Calendars"
    sequence:
      - variables:
          week_start: "{{ (now() - timedelta(days=now().isoweekday() - 1)).strftime('%Y-%m-%dT00:00:00') }}"
          week_end: "{{ (now() - timedelta(days=now().isoweekday() - 1) + timedelta(days=7)).strftime('%Y-%m-%dT00:00:00') }}"
          schedule_parts: ""
          schedule_count: 0
      - repeat:
          for_each: "{{ range(1, 12) | list }}"
          sequence:
            - variables:
                current_zone: "{{ repeat.item }}"
            - action: calendar.get_events
              target:
                entity_id: "calendar.irrigator_zone_{{ repeat.item }}"
              data:
                start_date_time: "{{ week_start }}"
                end_date_time: "{{ week_end }}"
              response_variable: cal_response
            - variables:
                zone_events: "{{ ((cal_response.values() | list | first).events if cal_response else []) | default([]) }}"
            - repeat:
                for_each: "{{ zone_events }}"
                sequence:
                  - variables:
                      ev_start: "{{ as_datetime(repeat.item.start) }}"
                      ev_end: "{{ as_datetime(repeat.item.end) }}"
                  - variables:
                      ev_raw_dur: "{{ ((ev_end - ev_start).total_seconds() / 60) | int }}"
                  - variables:
                      ev_dur: "{{ [1, [ev_raw_dur, 60] | min] | max }}"
                      ev_rec: >-
                        {{ '{"zone":' ~ current_zone ~ ',"day_of_week":' ~ ev_start.isoweekday()
                        ~ ',"start_time":' ~ (ev_start.strftime('%H:%M') | tojson)
                        ~ ',"duration_min":' ~ ([1, [ev_raw_dur, 60] | min] | max) ~ ',"active":true}' }}
                  - variables:
                      schedule_parts: "{{ schedule_parts ~ (',' if schedule_parts else '') ~ ev_rec }}"
                      schedule_count: "{{ schedule_count + 1 }}"
      - if:
          - condition: template
            value_template: "{{ schedule_count | int(0) > 32 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Irrigator schedule NOT published"
              message: >-
                The combined schedule across all 11 zone calendars has
                {{ schedule_count }} time blocks, over the device's 32-record
                limit. Remove some events and try again (use the "Publish
                Schedule Now" button).
        else:
          - action: mqtt.publish
            data:
              topic: "irrigatorF4/cmd/upload/schedule.json"
              payload: "[{{ schedule_parts }}]"

  # ---------------------------------------------------------------------
  # Device -> HA, ONE-TIME convenience only: seed the 11 Local Calendars
  # from whatever schedule.json the device currently has, so you don't have
  # to hand-re-enter an existing schedule after creating the calendars.
  # Run via the "Populate Calendars From Device" button, right after
  # creating the 11 calendar integrations, BEFORE arming
  # input_boolean.irrigator_schedule_sync_enabled. Re-running this after
  # calendars already have events will create DUPLICATES - there's no
  # dedup/idempotency check, since `calendar.create_event` has no documented
  # "only if it doesn't already exist" mode. If you need to re-run it,
  # delete the existing events for that zone first.
  #
  # VERIFY BEFORE RELYING ON: `calendar.create_event`'s exact field names
  # (assumed here: `summary`, `start_date_time`, `end_date_time`, `rrule`)
  # couldn't be confirmed against current docs from here either - check
  # Developer Tools > Actions > "Calendar: Create event" for the exact
  # field list your HA version expects before running this for real.
  # ---------------------------------------------------------------------
  irrigator_populate_calendars_from_device:
    alias: "Irrigator: one-time seed Local Calendars from device schedule.json"
    sequence:
      - variables:
          records: "{{ state_attr('sensor.irrigator_schedule', 'records') or [] }}"
          rrule_days: ["MO", "TU", "WE", "TH", "FR", "SA", "SU"]
      - repeat:
          for_each: "{{ records }}"
          sequence:
            - variables:
                rec: "{{ repeat.item }}"
                today_iso: "{{ now().isoweekday() }}"
            - variables:
                days_ahead: "{{ (rec.day_of_week - today_iso) % 7 }}"
                event_date: "{{ (now() + timedelta(days=days_ahead)).strftime('%Y-%m-%d') }}"
            - variables:
                start_dt: "{{ event_date ~ 'T' ~ rec.start_time ~ ':00' }}"
                end_dt: >-
                  {{ (as_datetime(event_date ~ 'T' ~ rec.start_time ~ ':00') + timedelta(minutes=rec.duration_min)).strftime('%Y-%m-%dT%H:%M:00') }}
                zone_name: >-
                  {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get(rec.zone | string, {}).get('name', '#' ~ rec.zone ~ ' (no name)') }}
            - action: calendar.create_event
              target:
                entity_id: "calendar.irrigator_zone_{{ rec.zone }}"
              data:
                summary: "{{ zone_name }}"
                start_date_time: "{{ start_dt }}"
                end_date_time: "{{ end_dt }}"
                rrule: "FREQ=WEEKLY;BYDAY={{ rrule_days[rec.day_of_week - 1] }}"

            data: {zone: 11, duration: "{{ states('input_number.irrigator_zone_11_duration') | int(5) }}"}
        turn_off:
          - action: script.irrigator_stop

  # Schedule Active: template version of the entity that used to be a plain
  # `mqtt: switch:` (see the NOTE in the `mqtt:` block above). `state:` reads
  # the device's own echo via the read-only sensor added there; writes go
  # through script.irrigator_enqueue_or_publish instead of a raw
  # command_topic so they queue for retry when offline, and it carries no
  # `availability:` so it's never greyed out.
  #
  # Watering Percentage is NOT a sibling of this (despite both being direct
  # MQTT entities historically) - it's now input_number.irrigator_watering_percentage
  # (see `input_number:` below), a plain local helper like every other
  # settings.json field, republished via script.irrigator_publish_settings
  # instead of its own cmd/watering_percentage topic. See that helper's
  # comment for why: cmd/watering_percentage still exists on the firmware
  # side (main.ino's `commandName == "watering_percentage"`) for direct/manual
  # MQTT use, but nothing in this package publishes to it anymore.
  - switch:
      # `name:` deliberately includes the "Irrigator " prefix (matching the
      # pump/zone switches above, not the mqtt: platform's device-linked
      # entities below) - this platform has no `device:` grouping in this
      # file, so entity_id is a plain slugify(name); without the prefix this
      # would register as switch.schedule_active instead of the
      # switch.irrigator_schedule_active every script/automation/dashboard
      # card here already references.
      - name: "Irrigator Schedule Active"
        unique_id: irrigator_schedule_active
        icon: mdi:calendar-check
        state: "{{ is_state('binary_sensor.irrigator_scheduled_state', 'on') }}"
        turn_on:
          - action: script.irrigator_enqueue_or_publish
            data: {topic: "irrigatorF4/cmd/scheduled", payload: "true"}
        turn_off:
          - action: script.irrigator_enqueue_or_publish
            data: {topic: "irrigatorF4/cmd/scheduled", payload: "false"}

  - binary_sensor:
      # Zone-enabled flags (unrelated to watering activity, which the
      # switches above already cover live). default_entity_id/attributes
      # here are unaffected by the switch-specific restriction discussed
      # above.
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('1', {}).get('name', '#1 (no name)') }} Enabled
        unique_id: irrigator_zone_1_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_1_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('1', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('2', {}).get('name', '#2 (no name)') }} Enabled
        unique_id: irrigator_zone_2_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_2_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('2', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('3', {}).get('name', '#3 (no name)') }} Enabled
        unique_id: irrigator_zone_3_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_3_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('3', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('4', {}).get('name', '#4 (no name)') }} Enabled
        unique_id: irrigator_zone_4_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_4_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('4', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('5', {}).get('name', '#5 (no name)') }} Enabled
        unique_id: irrigator_zone_5_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_5_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('5', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('6', {}).get('name', '#6 (no name)') }} Enabled
        unique_id: irrigator_zone_6_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_6_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('6', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('7', {}).get('name', '#7 (no name)') }} Enabled
        unique_id: irrigator_zone_7_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_7_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('7', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('8', {}).get('name', '#8 (no name)') }} Enabled
        unique_id: irrigator_zone_8_enabled_sensor
        default_entity_id: binary_sensor.irrigator_zone_8_enabled_sensor
        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('8', {}).get('enabled', true) }}"
      - name: >-
          {{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('9', {}).get('name', '#9 (no name)') }} Enabled
        unique_id: irrigator_zone_9_enabled_sensor

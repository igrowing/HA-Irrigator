  # Remaining-minutes counters, one per pump/zone - moved out of the
  # switches' `attributes:` (switch doesn't support that key) into their own
  # sensors. 0 unless this zone/pump is the one /state currently reports as
  # active (the device only ever runs one thing at a time, so at most one of
  # these 12 is ever non-zero).
  - sensor:
      - name: "Irrigator Pump Remaining"
        unique_id: irrigator_pump_remaining_sensor
        default_entity_id: sensor.irrigator_pump_remaining
        icon: mdi:timer-sand
        unit_of_measurement: min
        state: "{{ state_attr('sensor.irrigator_watering_state', 'remaining_min') | int(0) if state_attr('sensor.irrigator_watering_state', 'pump') else 0 }}"
      - name: "Irrigator Zone 1 Remaining"
        unique_id: irrigator_zone_1_remaining_sensor
        default_entity_id: sensor.irrigator_zone_1_remaining

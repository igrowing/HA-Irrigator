    name: "Duration"
    icon: mdi:timer-outline
    min: 1
    max: 120
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5
  irrigator_zone_2_duration: *zone_duration_helper
  irrigator_zone_3_duration: *zone_duration_helper
  irrigator_zone_4_duration: *zone_duration_helper
  irrigator_zone_5_duration: *zone_duration_helper
  irrigator_zone_6_duration: *zone_duration_helper
  irrigator_zone_7_duration: *zone_duration_helper
  irrigator_zone_8_duration: *zone_duration_helper
  irrigator_zone_9_duration: *zone_duration_helper
  irrigator_zone_10_duration: *zone_duration_helper
  irrigator_zone_11_duration: *zone_duration_helper

  # Settings tab: default_manual_duration (1-60 per ha.md) + current-sensor
  # calibration. All of these go out via the full-settings republish script
  # (script.irrigator_publish_settings) - see irrigator_automations.yaml.
  irrigator_default_manual_duration:
    name: "Default Manual Duration"
    icon: mdi:timer-cog-outline
    min: 1
    max: 60
    step: 1
    mode: slider
    unit_of_measurement: min
    initial: 5

  # Garden tab: manual watering_percentage override. Used to be a template
  # `number:` entity that published straight to cmd/watering_percentage on
  # every set_value - which meant an unrelated full-settings republish
  # (triggered by, say, a zone name edit) could race a momentary echo-sensor
  # dropout and silently stomp the device's real percentage back to 100 (see
  # the "Irrigator: republish full settings.json" comment in
  # irrigator_automations.yaml for the mechanics of that class of bug). Now a
  # plain input_number like every other settings.json field: seeded from the
  # device on every settings.json download ("Irrigator - sync device settings
  # to local helpers"), and any user edit goes out via the SAME full-settings
  # republish as the other 15 fields ("Irrigator - republish settings on
  # local helper change") - both guarded by input_boolean.irrigator_syncing_from_device
  # so a value just received from the device is never bounced straight back.
  # Trade-off: unlike the old echo-sourced entity, this does NOT live-update
  # when the device's own weather-driven auto-adjustment changes
  # wateringPercentage on its own (main.ino's AutoAdjustment calls) - it only
  # picks that up on the next settings.json (re)download. Still visible live
  # in the meantime via sensor.irrigator_watering_percentage_echo (the
  # /watering_percentage echo sensor), which is unaffected by this change.
  irrigator_watering_percentage:
    name: "Watering Percentage"
    icon: mdi:water-percent
    min: 0
    max: 300
    step: 5
    mode: box
    unit_of_measurement: "%"
    initial: 100

  # Auto-adjustment clamp bounds - the only two auto-adjustment fields
  # editable from HA (per Phase 5); everything else in that feature is read-only, see the
  # template sensors above.
  irrigator_upper_limit:
    name: "Auto-Adjustment Upper Limit"
    icon: mdi:water-plus-outline
    min: 0
    max: 500
    step: 5
    mode: box
    unit_of_measurement: "%"
    initial: 200
  irrigator_lower_limit:
    name: "Auto-Adjustment Lower Limit"
    icon: mdi:water-minus-outline
    min: 0
    max: 500
    step: 5
    mode: box
    unit_of_measurement: "%"
    initial: 40

  # Step 1's rain-skip trigger thresholds - also user-configurable from HA (see
  # domain::shouldSkipForRain). Probability is inclusive (>=), amount is not (>).
  irrigator_rain_skip_probability:
    name: "Rain-Skip Probability Threshold"
    icon: mdi:weather-pouring
    min: 0
    max: 100
    step: 5
    mode: box
    unit_of_measurement: "%"
    initial: 70
  irrigator_rain_skip_amount:
    name: "Rain-Skip Amount Threshold"
    icon: mdi:water-alert-outline
    min: 0
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "mm"
    initial: 4

  irrigator_valve_zero_offset_mv:
    name: "Valve Current Zero Offset"
    icon: mdi:current-ac
    min: 0
    max: 3300
    step: 1
    mode: box
    unit_of_measurement: mV
    initial: 1650
  irrigator_valve_mv_per_ma:
    name: "Valve Current mV/mA"
    icon: mdi:sine-wave
    min: 0.01
    max: 20
    step: 0.01
    mode: box
    initial: 1.0
  irrigator_pump_zero_offset_mv:
    name: "Pump Current Zero Offset"
    icon: mdi:current-ac
    min: 0
    max: 3300
    step: 1
    mode: box
    unit_of_measurement: mV
    initial: 1650
  irrigator_pump_mv_per_ma:
    name: "Pump Current mV/mA"
    icon: mdi:sine-wave
    min: 0.01
    max: 20
    step: 0.01
    mode: box
    initial: 1.0

  # Schedule editor panel field (Schedule tab) - see script.irrigator_schedule_save.

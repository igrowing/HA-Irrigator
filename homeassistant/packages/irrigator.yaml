# -----------------------------------------------------------------------
# Schedule tab: record picker + edit fields, replacing the earlier Local
# Calendar design (calendar.create_event has no `rrule` field - true
# recurrence is a frontend-only capability of the calendar dialog, not
# something a script can set - so an automation-driven calendar could only
# ever have been a partial solution; this editor works directly against
# schedule.json's records instead, no calendar entities involved).
#
# irrigator_schedule_picker's options are rebuilt on every schedule/settings
# change (see "Irrigator - rebuild schedule editor dropdown options" in
# irrigator_automations.yaml), one per current record plus "+ Add new",
# formatted "[<index>] Zone <n> - <name> - <day> <time> - <dur>min" - the
# leading "[<index>]" is the record's position in sensor.irrigator_schedule's
# `records` list (also shown as the "#" column in the "Device Schedule"
# table below, regardless of how that table is currently sorted), which is
# how script.irrigator_schedule_save/_delete know which record to touch.
# irrigator_edit_zone's options are rebuilt the same way, formatted
# "<n> - <name>".
# -----------------------------------------------------------------------
input_select:
  irrigator_schedule_picker:
    name: "Schedule Record"
    icon: mdi:calendar-search
    options: ["+ Add new"]
    initial: "+ Add new"

  irrigator_edit_zone:
    name: "Zone"
    icon: mdi:sprinkler-variant
    options: ["1 - #1 (no name)"]
    initial: "1 - #1 (no name)"

  irrigator_edit_day:
    name: "Day"
    icon: mdi:calendar-week
    options: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
    initial: "Mon"

  # Purely a display-order control for the "Device Schedule" markdown table
  # (see garden_tab.yaml) - a stock markdown card can't run JS, so a real
  # click-the-column-header sort isn't possible; this dropdown is the native
  # equivalent. Doesn't touch the device or any helper.
  irrigator_schedule_sort_by:
    name: "Sort Schedule Table By"
    icon: mdi:sort
    options: ["Day", "Zone", "Name", "Start", "Duration", "Active"]
    initial: "Day"

input_datetime:
  # Schedule editor panel field (Schedule tab) - see script.irrigator_schedule_save.
  irrigator_edit_start_time:
    name: "Start Time"
    icon: mdi:clock-outline
    has_date: false
    has_time: true


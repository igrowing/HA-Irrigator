# =============================================================================
# Irrigator - Home Assistant package (entities)
# =============================================================================
# BEFORE USE: replace every occurrence of `irrigatorF4` in this file (and in
# irrigator_automations.yaml / dashboards/garden_tab.yaml) with your device's
# real MQTT prefix: "irrigator" + the last 2 hex chars of its MAC address.
# Find it by watching `<something>/online` retained messages on your broker,
# or by publishing to `irrigator??/cmd/status` and seeing what answers.
#
# Assumes the `mqtt:` integration is already configured and connected to the
# same broker as the device - this package only adds entities, not a broker
# connection. See ../README.md for the full setup checklist.
# =============================================================================

# `device:` and `availability:` are per-entity options (nested inside each
# entity's own config dict, alongside name/state_topic/etc.) - NOT siblings
# of the domain key at the mqtt: list-item level. Every entity below aliases
# the same &irrigator_device / &irrigator_availability anchors (defined once,
# on the first entity that needs each) so there's still only one place to
# edit device metadata (e.g. "model") or the availability topic.
mqtt:
  # Device name is "Irrigator" (NOT "HA-Irrigator" or anything with
  # "Irrigator" repeated) *on purpose*, and every entity below that links to
  # this device drops the redundant leading "Irrigator " from its own
  # `name:` for the same reason: when an MQTT entity is linked to a
  # `device:`, HA generates its entity_id as
  # `slugify(device_name) + "_" + slugify(entity_name)` - "Irrigator" +
  # "Status" gives exactly `sensor.irrigator_status` (what everything else
  # in this package already references), whereas the earlier "HA-Irrigator"
  # device name + "Irrigator Status" entity name doubled up into
  # `sensor.ha_irrigator_irrigator_status` (confirmed on a live instance).
  binary_sensor:
    - name: "Online"
      unique_id: irrigator_online
      device_class: connectivity
      state_topic: "irrigatorF4/online"
      payload_on: "true"
      payload_off: "false"
      device: &irrigator_device
        identifiers: ["irrigatorF4"]
        name: "Irrigator"
        manufacturer: "DIY"
        model: "ESP32 Irrigation Controller"

    # Read-only echo of the device's own /scheduled topic. The interactive
    # switch.irrigator_schedule_active (template platform, further down)
    # reads its `state:` from this - kept separate so the switch itself can
    # go through script.irrigator_enqueue_or_publish instead of a plain
    # command_topic, and so it's never greyed out by `availability:`.
    - name: "Scheduled State"
      unique_id: irrigator_scheduled_state
      icon: mdi:calendar-check
      state_topic: "irrigatorF4/scheduled"
      payload_on: "true"
      payload_off: "false"
      device: *irrigator_device
      availability: &irrigator_availability
        - topic: "irrigatorF4/online"
          payload_available: "true"
          payload_not_available: "false"

  sensor:
    # Renamed to "Address" (not "Status") since its state is the device's
    # IP - this only changes the displayed friendly name, not entity_id
    # (already frozen as sensor.irrigator_status from first creation; see
    # the entity_id-freezing notes elsewhere in this file/README).
    - name: "Address"
      unique_id: irrigator_status
      icon: mdi:information-outline
      state_topic: "irrigatorF4/status"
      value_template: "{{ value_json.ip }}"
      json_attributes_topic: "irrigatorF4/status"
      device: *irrigator_device
      availability: *irrigator_availability

    # Live watering/pump status, per ha.md #1 ("update the status of cards
    # from the messages coming on topic <prefix>/state"). json_attributes_topic
    # makes every top-level key of the /state payload (zone, name, on, pump,
    # reason, scheduled, remaining_min) available via state_attr() - the
    # manual-control switches below read this, not a separate parse. If
    # toggles never reflect real device state, check (in this order):
    # (1) Developer Tools > States > sensor.irrigator_watering_state - does
    # it show attributes at all, or none/unknown? (2) if none, is the MQTT
    # integration actually connected to the same broker as the device, and
    # is `irrigatorF4` really this device's prefix (see header note)? use
    # Developer Tools > MQTT > Listen to a topic, subscribe to
    # `irrigatorF4/#`, and trigger a manual run to confirm the device
    # publishes at all. (3) if attributes DO show real data but a specific
    # switch still won't reflect it, check that switch's `state:` template
    # in the `template:` block below for a typo against the exact attribute
    # names here.
    - name: "Watering State"
      unique_id: irrigator_watering_state
      icon: mdi:sprinkler-variant
      state_topic: "irrigatorF4/state"
      value_template: "{{ 'watering' if (value_json.on or value_json.pump) else 'idle' }}"
      json_attributes_topic: "irrigatorF4/state"
      device: *irrigator_device
      availability: *irrigator_availability

    - name: "Last Alert"
      unique_id: irrigator_last_alert
      icon: mdi:alert-circle-outline
      state_topic: "irrigatorF4/alert"
      value_template: >-
        {{ value_json.message if value_json.message is defined else (value_json | tojson) }}
      json_attributes_topic: "irrigatorF4/alert"
      device: *irrigator_device
      availability: *irrigator_availability

    - name: "Queue"
      unique_id: irrigator_queue
      icon: mdi:format-list-numbered
      state_topic: "irrigatorF4/queue"
      value_template: "{{ value_json | length }}"
      json_attributes_topic: "irrigatorF4/queue"
      json_attributes_template: "{{ {'items': value_json} | tojson }}"
      device: *irrigator_device
      availability: *irrigator_availability

    # Full settings.json snapshot - the ONLY source for zone names anywhere
    # in this dashboard (Terminology section of ha.md: never hardcode "Zone
    # N" as if it were a real name). Requested via cmd/download/settings.json
    # whenever HA doesn't have a value yet (on startup, AND whenever the
    # device (re)connects - see "Irrigator - request initial data on virgin
    # deploy" in irrigator_automations.yaml) and thereafter simply reflects
    # whatever last arrived on this topic. If zone names show as "#N (no
    # name)" (the explicit not-a-real-name placeholder used everywhere
    # below) instead of real names, check Developer Tools > States >
    # sensor.irrigator_settings - if its `zone_names` attribute is missing
    # entirely, this sensor has never received a payload; press "Refresh
    # From Device" and confirm via Developer Tools > MQTT > Listen to a
    # topic on `irrigatorF4/download/settings.json` that a reply actually
    # arrives.
    - name: "Settings"
      unique_id: irrigator_settings
      icon: mdi:cog-outline
      state_topic: "irrigatorF4/download/settings.json"
      value_template: "{{ value_json.watering_percentage }}"
      unit_of_measurement: "%"
      json_attributes_topic: "irrigatorF4/download/settings.json"
      device: *irrigator_device
      availability: *irrigator_availability

    # Read-only echo of the device's own /watering_percentage topic. No
    # longer what the interactive control reads its state from
    # (input_number.irrigator_watering_percentage, further down, is a plain
    # local helper instead - see its comment for why) - this sensor is now
    # purely a live display of whatever the device's current percentage
    # actually is, including changes the device makes on its own via
    # weather-driven auto-adjustment (main.ino's AutoAdjustment calls),
    # which the input_number only picks up on the next settings.json
    # (re)download.
    - name: "Watering Percentage Echo"
      unique_id: irrigator_watering_percentage_echo
      icon: mdi:water-percent
      state_topic: "irrigatorF4/watering_percentage"
      unit_of_measurement: "%"
      device: *irrigator_device
      availability: *irrigator_availability

  # NOTE: the device-side mirror of schedule.json is a trigger-based template
  # sensor (sensor.irrigator_schedule, further down under `template:`), not a
  # plain `mqtt: sensor:` here - it needs to listen on two different topics
  # (the live push on every change, and the one-shot virgin-deploy download
  # response) and merge them into one entity, which a single `state_topic`
  # can't do.
  #
  # Schedule Active / Watering Percentage themselves are no longer plain
  # `mqtt: switch:` / `mqtt: number:` entities - their command side moved to
  # `template:` switch/number entities below (turn_on/turn_off/set_value
  # calling script.irrigator_enqueue_or_publish) so a write made while
  # offline can be queued instead of silently dropped, and so they're never
  # greyed out by `availability:`. See "Scheduled State" / "Watering
  # Percentage Echo" above for the plain sensors that still mirror the
  # device's own echo on those two topics.

# -----------------------------------------------------------------------
# Manual-control switches (part 1 of the Garden tab): one per pump/zone,
# reflecting the live `state` topic and starting/stopping via the scripts
# below (cmd/run needs a JSON body with a duration, which a plain MQTT
# switch payload_on can't provide - hence template switches + scripts
# instead of plain `mqtt: switch:` entries here).
#
# `name:` IS templated to the live zone name (same "#N (no name)"-style
# fallback pattern as everywhere else)... except the fallback text below is
# NOT "#N (no name)" like elsewhere - it's "Irrigator Zone N". Reason:
# template `switch` doesn't support `default_entity_id` (confirmed via a
# live DisallowedExtraPropWarning), so nothing pins entity_id directly - but
# entity_id is only ever auto-generated ONCE, at the entity's first-ever
# creation, from whatever `name:` renders to AT THAT MOMENT; every later
# re-render (once real zone names arrive) only updates the displayed name,
# never the frozen entity_id. On a fresh deploy, sensor.irrigator_settings
# has no data yet at that first moment, so the fallback text is what
# actually gets slugified into the permanent switch.irrigator_zone_N -
# hence a fallback chosen to slug to exactly that ("Irrigator Zone 1" ->
# "irrigator_zone_1"), not the generic "#N (no name)" placeholder used
# elsewhere (which would slug to something unrelated and permanently wrong).
# One edge case this doesn't cover: if sensor.irrigator_settings already
# holds real cached data the very first time these specific switch configs
# are ever loaded (e.g. added to an installation that's had this package
# running for a while under a different entity set), the real name would be
# used for that first slug instead, and entity_id could come out as
# something other than switch.irrigator_zone_N. Not a concern for a fresh
# deploy (the normal case), but worth knowing if this file is ever
# restructured later on a long-running instance.
# `remaining_min` still can't live on the switch as `attributes:` (same
# restriction, unrelated to naming) - see the dedicated sensor.irrigator_*_remaining
# entities further down for that.
#
# No `availability:` on any of these (deliberately, on flaky Wi-Fi where the
# device drops offline often) - turn_on/turn_off go through
# script.irrigator_start/irrigator_stop, which route through
# script.irrigator_enqueue_or_publish and queue on sensor.irrigator_command_queue
# when the device is offline instead of publishing straight away. See
# "Offline command queue" in ../README.md for the full mechanism.
# -----------------------------------------------------------------------
template:
  - switch:
      - name: "Irrigator Pump"
        unique_id: irrigator_switch_pump
        icon: mdi:pump
        state: "{{ state_attr('sensor.irrigator_watering_state', 'pump') | default(false) }}"
        turn_on:
          - action: script.irrigator_start
            data:
              zone: 0
              duration: "{{ states('input_number.irrigator_pump_duration') | int(5) }}"
        turn_off:
          - action: script.irrigator_stop

      - name: >-
          {{ ('1. ' ~ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('1', {}).get('name')) if (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('1', {}).get('name') else 'Irrigator Zone 1' }}
        unique_id: irrigator_switch_zone_1
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 1 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:
          - action: script.irrigator_start
            data: {zone: 1, duration: "{{ states('input_number.irrigator_zone_1_duration') | int(5) }}"}
        turn_off:
          - action: script.irrigator_stop


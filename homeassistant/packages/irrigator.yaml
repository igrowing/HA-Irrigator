  irrigator_zone_4_name: {name: "Zone 4 Name", icon: mdi:label-outline, max: 15, initial: "#4 (no name)"}
  irrigator_zone_5_name: {name: "Zone 5 Name", icon: mdi:label-outline, max: 15, initial: "#5 (no name)"}
  irrigator_zone_6_name: {name: "Zone 6 Name", icon: mdi:label-outline, max: 15, initial: "#6 (no name)"}
  irrigator_zone_7_name: {name: "Zone 7 Name", icon: mdi:label-outline, max: 15, initial: "#7 (no name)"}
  irrigator_zone_8_name: {name: "Zone 8 Name", icon: mdi:label-outline, max: 15, initial: "#8 (no name)"}
  irrigator_zone_9_name: {name: "Zone 9 Name", icon: mdi:label-outline, max: 15, initial: "#9 (no name)"}
  irrigator_zone_10_name: {name: "Zone 10 Name", icon: mdi:label-outline, max: 15, initial: "#10 (no name)"}
  irrigator_zone_11_name: {name: "Zone 11 Name", icon: mdi:label-outline, max: 15, initial: "#11 (no name)"}

  # WeatherAPI.com fallback key (Settings::weatherApiKey) - only ever used when Open-Meteo's
  # keyless call fails. mode: password just masks the dashboard tile; the key is still visible in
  # plaintext via sensor.irrigator_settings' attributes below (see the comment on that field in
  # Settings.h) - there's no way to selectively exclude one attribute from that sensor without
  # reworking it entirely, so this isn't a real secret store, just a convenience field.
  irrigator_weatherapi_key: {name: "WeatherAPI.com Key", icon: mdi:key-outline, max: 47, mode: password, initial: ""}

input_boolean:
  # Schedule editor panel field (Schedule tab) - see script.irrigator_schedule_save.
  irrigator_edit_active:
    name: "Active"
    icon: mdi:check-circle-outline
    initial: true

  # Internal guard, not on any dashboard - see the "Irrigator - sync device
  # settings to local helpers" / "Irrigator - republish settings on local
  # helper change" automations in irrigator_automations.yaml for what it

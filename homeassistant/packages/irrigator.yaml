        unique_id: irrigator_switch_zone_6
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 6 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:

        state: "{{ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('11', {}).get('enabled', true) }}"

  # Remaining-minutes counters, one per pump/zone - moved out of the
  # switches' `attributes:` (switch doesn't support that key) into their own
  # sensors. 0 unless this zone/pump is the one /state currently reports as
  # active (the device only ever runs one thing at a time, so at most one of
  # these 12 is ever non-zero).
  #
  # Deliberately NOT re-synced from the device every tick: the device only
  # publishes /state on start/stop edges (see MqttService::publishState call
  # sites in main.ino), and polling it more often just to keep this number
  # fresh would mean extra MQTT traffic/device wake-ups for a number nobody
  # needs to the second. Instead each sensor free-runs locally: it takes the
  # `remaining_min` and `datetime` attributes from the *last* /state message
  # (the values at the moment the run started) and counts down from there
  # using HA's own clock - `elapsed_min` below. Referencing `now()` in the
  # template makes HA's template engine re-evaluate it once a minute on its
  # own (a built-in effect of any template that calls now()/utcnow() - see
  # helpers/template.py's time-tracking in HA core), so this ticks down
  # without any additional automation, MQTT traffic, or recorder writes
  # beyond one state change per minute while active. The two clocks (device
  # and HA) drifting apart over a run of up to ~120 min (see the manual-run
  # duration sliders) is not worth worrying about - see ha.md.
  #
  # The `+00:00` appended before `as_datetime` matters: formatIso8601Utc()
  # (CalendarMath.cpp) emits a bare "2026-07-12T06:00:00" with no zone
  # suffix even though the value is always UTC, so without forcing an
  # offset, `as_datetime` returns a naive datetime that can't be subtracted
  # from HA's tz-aware `now()`.
  - sensor:
      # Device-reported `uptime_s` (main.ino's `doc["uptime_s"] = nowMs / 1000UL`, an attribute
      # on sensor.irrigator_address_2's /status payload) is raw seconds - not friendly to read at
      # a glance for anything past a couple of hours. This reformats it as DD:HH:MM:SS (2 digits
      # each; days can't realistically exceed 2 digits since millis() itself wraps at ~49.7 days,
      # long before nowMs/1000UL would).
      - name: "Irrigator Uptime"
        unique_id: irrigator_uptime_formatted
        icon: mdi:clock-outline
        state: >-
          {% set s = state_attr('sensor.irrigator_address_2', 'uptime_s') | int(0) %}
          {{ '%02d:%02d:%02d:%02d' | format(s // 86400, (s % 86400) // 3600, (s % 3600) // 60, s % 60) }}
      - name: "Irrigator Pump Remaining"
        unique_id: irrigator_pump_remaining_sensor
        default_entity_id: sensor.irrigator_pump_remaining
        icon: mdi:timer-sand
        unit_of_measurement: min
        state: >-
          {% set active = state_attr('sensor.irrigator_watering_state', 'pump') | default(false) %}
          {% if active %}
            {% set started = (state_attr('sensor.irrigator_watering_state', 'datetime') ~ '+00:00') | as_datetime %}
            {% set elapsed_min = ((now() - started).total_seconds() / 60) | int(0) %}
            {{ [state_attr('sensor.irrigator_watering_state', 'remaining_min') | int(0) - elapsed_min, 0] | max }}
          {% else %}
            0
          {% endif %}
      - name: "Irrigator Zone 1 Remaining"

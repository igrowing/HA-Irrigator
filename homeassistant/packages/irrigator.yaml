        unique_id: irrigator_switch_zone_4
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 4 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:
          - action: script.irrigator_start
            data: {zone: 4, duration: "{{ states('input_number.irrigator_zone_4_duration') | int(5) }}"}
        turn_off:
          - action: script.irrigator_stop

      - name: >-
          {{ ('5. ' ~ (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('5', {}).get('name')) if (state_attr('sensor.irrigator_settings', 'zone_names') or {}).get('5', {}).get('name') else 'Irrigator Zone 5' }}
        unique_id: irrigator_switch_zone_5
        icon: mdi:sprinkler-variant

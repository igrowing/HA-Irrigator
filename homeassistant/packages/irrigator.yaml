# -----------------------------------------------------------------------
# Backup/restore file plumbing for script.irrigator_backup_from_device /
# script.irrigator_restore_from_backup below (see `script:`'s comment on
# each). Both settings.json and schedule.json land under
# /config/irrigator_backups/ - "latest" is what Restore always reads;
# the timestamped copy alongside it is a manually-browsable history
# (Studio Code Server / File editor / Samba add-on), never read by
# anything here. `/config` is Home Assistant's own config directory,
# reachable identically on HA OS, Supervised, and Docker installs.
#
# Content NEVER touches a shell command string in either direction:
#   - Write: `command_line: notify:` pipes its `message` field to the
#     command's STDIN (confirmed against home-assistant/core's
#     command_line/notify.py - `proc.communicate(input=message)`), so a
#     zone name with a quote, `$`, or backtick in it is inert - it's
#     just bytes on a pipe, never re-parsed as shell syntax. The command
#     itself is 100% static (no `{{ }}`), so it isn't subject to
#     `shell_command`'s "no `>`/`|`/`~`" template restriction either.
#   - Read: `shell_command:` below is also fully static (no `{{ }}`), so
#     it takes the same real-shell path and its output is returned via
#     `response_variable` (`{{ result.stdout }}`) as a plain script
#     variable - no entity `state:` involved, so the ~255-char HA state
#     length limit that a sensor would hit on a multi-KB settings.json
#     never applies.
# Deliberately NOT a templated command with a per-call filename (e.g. one
# shared notify parameterized by "settings"/"schedule") - `command_line:
# notify:` always runs via a real shell even when templated (unlike
# shell_command's safer exec-when-templated mode), so keeping these fully
# static keeps the whole read/write path free of any injection surface
# to reason about, for a handful of near-identical lines' cost.
command_line:
  - notify:
      name: irrigator_backup_write_settings
      command: >-
        mkdir -p /config/irrigator_backups &&
        ts=$(date +%Y%m%d_%H%M%S) &&
        tee "/config/irrigator_backups/settings_$ts.json" > "/config/irrigator_backups/settings_latest.json"
  - notify:
      name: irrigator_backup_write_schedule
      command: >-
        mkdir -p /config/irrigator_backups &&
        ts=$(date +%Y%m%d_%H%M%S) &&
        tee "/config/irrigator_backups/schedule_$ts.json" > "/config/irrigator_backups/schedule_latest.json"

shell_command:
  # `cat` on a missing file exits non-zero with empty stdout - that's the
  # "no backup taken yet" signal script.irrigator_restore_from_backup checks
  # for via response_variable.returncode, not a failure worth surfacing as
  # a distinct error path.
  irrigator_backup_read_settings: "cat /config/irrigator_backups/settings_latest.json 2>/dev/null"
  irrigator_backup_read_schedule: "cat /config/irrigator_backups/schedule_latest.json 2>/dev/null"

# -----------------------------------------------------------------------
# Scripts - all device writes funnel through these so the JSON contract
# (see src/network/MqttService.cpp / src/main.ino handleMqttCommand) is
# built in exactly one place each.
# -----------------------------------------------------------------------
script:
  # Chokepoint for every device-bound MQTT write below (run/stop/test/settings/
  # schedule) - publishes immediately when the device is known online (today's
  # behavior, unchanged latency), otherwise appends {topic, payload} to
  # sensor.irrigator_command_queue via irrigator_queue_push for the
  # "Irrigator - flush pending command queue" automation to retry later.
  # binary_sensor.irrigator_online is the only online/offline signal that
  # exists (retained LWT topic) - there is no per-command device
  # acknowledgement for run/stop/scheduled/watering_percentage, so "published
  # while online" is the best available definition of success here.
  irrigator_enqueue_or_publish:
    alias: "Irrigator: publish now if online, else queue for retry"
    fields:
      topic:
        selector:
          text:
      payload:
        selector:
          text:
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.irrigator_online
                state: "on"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  payload: "{{ payload }}"
        default:
          - event: irrigator_queue_push
            event_data:
              topic: "{{ topic }}"
              payload: "{{ payload }}"

  irrigator_start:
    alias: "Irrigator: start zone or pump"
    fields:
      zone:
        selector:
          number: {min: 0, max: 11, step: 1}
      duration:
        selector:
          number: {min: 1, max: 120, step: 1}
    sequence:
      - action: script.irrigator_enqueue_or_publish
        data:
          topic: "irrigatorF4/cmd/run"
          payload: "{{ {'zone': zone, 'duration': duration} | tojson }}"

  irrigator_stop:
    alias: "Irrigator: stop current watering"
    sequence:
      - action: script.irrigator_enqueue_or_publish
        data:
          topic: "irrigatorF4/cmd/stop"
          payload: ""

  irrigator_stop_all:
    alias: "Irrigator: stop and clear queue"
    sequence:
      - action: script.irrigator_enqueue_or_publish
        data:
          topic: "irrigatorF4/cmd/stop"
          payload: "all"

  # Queues a short manual run on every zone the settings.json zone_names map
  # marks enabled (same "enabled" flag the binary_sensor.irrigator_zone_N_enabled_sensor
  # entities above read) - a quick way to confirm all real zones are wired up
  # without opening each switch by hand. The device itself serializes these
  # (see queue/state topics), so publishing all of them back-to-back just
  # fills the queue rather than running zones concurrently.
  irrigator_test_all:
    alias: "Irrigator: test all active zones"
    sequence:
      - variables:
          duration: "{{ states('input_number.irrigator_default_manual_duration') | int(5) }}"
      - repeat:
          for_each: "{{ range(1, 12) | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ (state_attr('sensor.irrigator_settings', 'Zones') or {}).get(repeat.item | string, {}).get('enabled', true) }}
              then:
                - action: script.irrigator_enqueue_or_publish
                  data:
                    topic: "irrigatorF4/cmd/run"
                    payload: "{{ {'zone': repeat.item, 'duration': duration} | tojson }}"

  irrigator_calibrate:
    alias: "Irrigator: capture current-sensor calibration base"
    sequence:
      - action: script.irrigator_enqueue_or_publish
        data:
          topic: "irrigatorF4/cmd/calibrate"
          payload: ""

  # Behind button.irrigator_refresh_from_device ("Backup from the Irrigator Device" - see
  # irrigator.yaml's `button:` block). Formerly just fire-and-forget cmd/download requests
  # (sensor.irrigator_settings/irrigator_schedule picked up whatever arrived, same as any other
  # download); now also waits for each response and writes it verbatim to
  # /config/irrigator_backups/ (see the command_line:/shell_command: block above) so there's an
  # actual recoverable file on the HA filesystem, not just live entity state that's gone the moment
  # a later download overwrites it. `trigger.payload` (not `payload_json`) is used for the write so
  # the backup is byte-identical to what the device sent - it is never reparsed/re-serialized
  # through Jinja's `tojson`, which could reorder keys or reformat numbers.
  #
  # Two independent wait_for_trigger/write pairs, not one combined wait: settings.json and
  # schedule.json arrive as two separate MQTT messages with no guaranteed order, and a device that
  # answers one but not the other (e.g. it reboots mid-response) should still back up whichever one
  # it did answer, rather than an all-or-nothing failure discarding a response that did arrive.
  irrigator_backup_from_device:
    alias: "Irrigator: backup settings.json + schedule.json from device to HA filesystem"
    sequence:
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/status", payload: ""}
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/settings.json", payload: ""}
      - wait_for_trigger:
          - trigger: mqtt
            topic: "irrigatorF4/download/settings.json"
        timeout:
          seconds: 15
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: notify.irrigator_backup_write_settings
            data:
              message: "{{ wait.trigger.payload }}"
        else:
          - action: persistent_notification.create
            data:
              title: "Irrigator backup: settings.json"
              message: >-
                No response from the device within 15s - is it online? Nothing was written; the
                previous backup (if any) under /config/irrigator_backups/ is untouched.
      - action: mqtt.publish
        data: {topic: "irrigatorF4/cmd/download/schedule.json", payload: ""}
      - wait_for_trigger:
          - trigger: mqtt
            topic: "irrigatorF4/download/schedule.json"
        timeout:
          seconds: 15
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: notify.irrigator_backup_write_schedule
            data:
              message: "{{ wait.trigger.payload }}"
        else:
          - action: persistent_notification.create
            data:
              title: "Irrigator backup: schedule.json"
              message: >-
                No response from the device within 15s - is it online? Nothing was written; the
                previous backup (if any) under /config/irrigator_backups/ is untouched.

  # Behind button.restore_to_the_irrigator_device ("Restore to the Irrigator Device" - the
  # entity_id comes from slugifying `name:` at first creation, NOT from `unique_id:` below
  # (unique_id only pins the registry entry across restarts for an un-device-linked template
  # entity like this one) - see
  # irrigator.yaml's `button:` block): uploads the LAST files script.irrigator_backup_from_device
  # wrote under /config/irrigator_backups/ back to the device, verbatim - not a reconstruction from
  # the Settings-tab helpers (that's script.irrigator_publish_settings's job, and it can only ever
  # cover the fields those helpers expose). Routed through script.irrigator_enqueue_or_publish, same
  # as every other device-bound write, so a restore requested while the device is briefly offline is
  # queued and retried rather than silently dropped.
  #
  # settings.json's device-owned fields (schedule_active, the two current-sensor calibration bases -
  # see script.irrigator_publish_settings' comment) are safe to restore from a stale backup: the
  # firmware overwrites whatever an upload carries for them with its own current values before
  # persisting (see mergeSettings() in Settings.h), so this can never revert a calibration or flip
  # the schedule on/off as a side effect.
  #
  # Deliberately does NOT auto-refresh sensor.irrigator_settings/irrigator_schedule afterward by
  # re-running the backup script: if the device was offline and the upload only got queued (not
  # actually delivered yet), an immediate re-backup would capture the device's OLD content and
  # silently overwrite the very backup file this restore just read from. Press "Backup from the
  # Irrigator Device" afterward to confirm the restore actually landed.
  irrigator_restore_from_backup:
    alias: "Irrigator: restore settings.json + schedule.json from HA filesystem backup to device"
    sequence:
      - action: shell_command.irrigator_backup_read_settings
        response_variable: irrigator_settings_backup
      - action: shell_command.irrigator_backup_read_schedule
        response_variable: irrigator_schedule_backup
      - if:
          - condition: template
            value_template: >-
              {{ irrigator_settings_backup.returncode == 0 and
                 (irrigator_settings_backup.stdout | trim | length) > 0 }}
        then:
          - action: script.irrigator_enqueue_or_publish
            data:
              topic: "irrigatorF4/cmd/upload/settings.json"
              payload: "{{ irrigator_settings_backup.stdout }}"
        else:
          - action: persistent_notification.create
            data:
              title: "Irrigator restore: settings.json"
              message: >-
                No backup found under /config/irrigator_backups/ - press "Backup from the Irrigator
                Device" at least once first.
      - if:
          - condition: template
            value_template: >-
              {{ irrigator_schedule_backup.returncode == 0 and
                 (irrigator_schedule_backup.stdout | trim | length) > 0 }}
        then:
          - action: script.irrigator_enqueue_or_publish
            data:
              topic: "irrigatorF4/cmd/upload/schedule.json"
              payload: "{{ irrigator_schedule_backup.stdout }}"
        else:
          - action: persistent_notification.create
            data:
              title: "Irrigator restore: schedule.json"
              message: >-
                No backup found under /config/irrigator_backups/ - press "Backup from the Irrigator
                Device" at least once first.

  # Full settings.json replace. Must include every field every time - the
  # firmware fills anything missing with factory defaults (parseSettings()),
  # it does not merge against what's currently on flash. This is the ONLY
  # settings-writing script.
  #
  # settings.json is nested into 4 groups (Zones/Location/Current_sensor/Watering - see
  # Settings.h). watering_percentage is read from input_number.irrigator_watering_percentage
  # (a plain local helper, same as default_manual_duration below) rather than from any device
  # echo - see that helper's comment in `input_number:` above for why.
  #
  # Watering.schedule_active and Current_sensor.valve/pump_current_base_level are device-owned
  # fields: the FIRMWARE ignores whatever a settings upload carries for them (schedule_active is
  # changed only via cmd/scheduled; the two current bases only via cmd/calibrate - see
  # mergeSettings()'s doc in Settings.h and handleMqttUpload's SETTINGS_FILE_PATH branch in
  # main.ino, which overwrites all three with the device's own current values before persisting).
  # So the values sent here are cosmetic - they cannot change the device. They're still included,
  # sourced from sensor.irrigator_settings' own last-downloaded attributes, purely so the JSON
  # stays a faithful full snapshot; schedule_active specifically is deliberately NOT read from
  # switch.irrigator_schedule_active (whose echo sensor reads a spurious `false` while
  # `unavailable` during a reconnect - the exact stale value that used to get uploaded and disable
  # the schedule before the firmware started ignoring it).
  #
  # watering_percentage and the 4 Current_sensor.alert_* toggles are NOT device-owned in the same
  # way - they're plain input_number/input_boolean helpers the user edits (see their comments in
  # `input_number:`/`input_boolean:` above), read directly, and the firmware DOES apply them from
  # an upload.
  irrigator_publish_settings:
    alias: "Irrigator: republish full settings.json"
    sequence:
      - variables:
          zn: >-
            {% set ns = namespace(parts=[]) %}
            {% for z in range(1, 12) %}
              {% set nm = states('input_text.irrigator_zone_' ~ z ~ '_name') | tojson %}
              {% set en = is_state('input_boolean.irrigator_zone_' ~ z ~ '_enabled', 'on') | tojson %}
              {% set ns.parts = ns.parts + ['"' ~ z ~ '":{"name":' ~ nm ~ ',"enabled":' ~ en ~ '}'] %}
            {% endfor %}
            {{ '{' ~ (ns.parts | join(',')) ~ '}' }}
          existing_watering: "{{ state_attr('sensor.irrigator_settings', 'Watering') or {} }}"
          existing_location: "{{ state_attr('sensor.irrigator_settings', 'Location') or {} }}"
          existing_current_sensor: "{{ state_attr('sensor.irrigator_settings', 'Current_sensor') or {} }}"
      # zn is already a JSON-object string, not a Python dict, so it can't be embedded via the
      # dict-literal-then-tojson pattern used for the other groups (that would double-encode it as
      # a quoted string). Instead the dict of the other 3 groups is rendered with tojson, then its
      # closing brace is sliced off and the "Zones" group spliced in directly - same idiom the
      # pre-nesting version of this script used for zone_names.
      - action: script.irrigator_enqueue_or_publish
        data:
          topic: "irrigatorF4/cmd/upload/settings.json"
          payload: >-
            {% set watering = {
              'watering_percentage': states('input_number.irrigator_watering_percentage') | int(100),
              'schedule_active': existing_watering.get('schedule_active', true),
              'auto_adjustment_enabled': existing_watering.get('auto_adjustment_enabled', true),
              'default_manual_duration': states('input_number.irrigator_default_manual_duration') | int(5),
              'upper_limit': states('input_number.irrigator_upper_limit') | int(200),
              'lower_limit': states('input_number.irrigator_lower_limit') | int(40),
              'rain_skip_probability_percent': states('input_number.irrigator_rain_skip_probability') | int(70),
              'rain_skip_amount_mm': states('input_number.irrigator_rain_skip_amount') | int(4),
              'weatherapi_key': states('input_text.irrigator_weatherapi_key') | default('')
            } %}
            {% set location = {
              'location_known': existing_location.get('location_known', false),
              'latitude': existing_location.get('latitude', 0),
              'longitude': existing_location.get('longitude', 0),
              'city': existing_location.get('city', '')
            } %}
            {% set current_sensor = {
              'valve_current_base_level': existing_current_sensor.get('valve_current_base_level', 0),
              'pump_current_base_level': existing_current_sensor.get('pump_current_base_level', 0),
              'alert_pump_uc': is_state('input_boolean.irrigator_alert_pump_uc', 'on'),
              'alert_pump_oc': is_state('input_boolean.irrigator_alert_pump_oc', 'on'),
              'alert_valve_uc': is_state('input_boolean.irrigator_alert_valve_uc', 'on'),
              'alert_valve_oc': is_state('input_boolean.irrigator_alert_valve_oc', 'on')
            } %}
            {% set base = {'Watering': watering, 'Location': location, 'Current_sensor': current_sensor} %}
            {% set base_json = (base | tojson) %}
            {{ base_json[:-1] ~ ',"Zones":' ~ zn ~ '}' }}

  # ---------------------------------------------------------------------
  # HA -> device: create or overwrite one schedule record from the editor
  # panel (Schedule tab) and republish the FULL schedule.json - same
  # "read the whole list, mutate, republish the whole file" contract
  # cmd/upload/schedule.json requires everywhere else (no partial-update
  # topic exists for this file).
  #
  # Which record gets replaced: the index encoded in the picker's currently
  # selected option, e.g. "[3] Zone 3 - Trees left - Tue 06:00 - 9min" -> 3,
  # an index into sensor.irrigator_schedule's `records` list in its natural
  # (unsorted) order - see "Irrigator - rebuild schedule editor dropdown
  # options" in irrigator_automations.yaml for how that string is built, and
  # the "#" column in the "Device Schedule" table (garden_tab.yaml) for the
  # same index shown regardless of the table's current sort order. "+ Add
  # new" has no leading "[", which parses to -1, meaning append a new
  # record instead of replacing one.
  # ---------------------------------------------------------------------
  irrigator_schedule_save:
    alias: "Irrigator: save schedule record from editor panel"
    sequence:
      - variables:
          picker: "{{ states('input_select.irrigator_schedule_picker') }}"
          idx: "{{ (picker.split(']')[0].split('[')[1] | int) if picker.startswith('[') else -1 }}"
          # Builds on a schedule edit still sitting unsent in the offline queue (if any) rather
          # than sensor.irrigator_schedule, which only updates from the device's own echo - which
          # won't arrive until it's back online. Falls back to the last-known device schedule when
          # nothing's queued, same as before.
          records: >-
            {% set pending = (state_attr('sensor.irrigator_command_queue', 'items') or []) | selectattr('topic', 'eq', 'irrigatorF4/cmd/upload/schedule.json') | list %}
            {{ (pending[-1].payload | from_json) if pending else (state_attr('sensor.irrigator_schedule', 'records') or []) }}
          day_names: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
          new_record:
            zone: "{{ states('input_select.irrigator_edit_zone').split(' - ')[0] | int }}"
            day_of_week: "{{ day_names.index(states('input_select.irrigator_edit_day')) + 1 }}"
            start_time: "{{ states('input_datetime.irrigator_edit_start_time')[:5] }}"
            duration_min: "{{ states('input_number.irrigator_edit_duration_min') | int(5) }}"
            active: "{{ is_state('input_boolean.irrigator_edit_active', 'on') }}"
      - variables:
          new_records: >-
            {{ (records[:idx] + [new_record] + records[idx+1:]) if 0 <= idx < (records | length) else (records + [new_record]) }}
      - if:
          - condition: template
            value_template: "{{ (new_records | length) > 32 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Irrigator schedule NOT saved"
              message: >-
                This would put the schedule at {{ new_records | length }}
                time blocks, over the device's 32-record limit. Delete an
                existing record first.
        else:
          - action: script.irrigator_enqueue_or_publish
            data:
              topic: "irrigatorF4/cmd/upload/schedule.json"
              payload: "{{ new_records | tojson }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_schedule_picker
            data:
              option: "+ Add new"

  # HA -> device: remove the record currently selected in the editor panel
  # and republish the full schedule.json, same contract as the save script
  # above. No-op (with a notification) if "+ Add new" is selected, since
  # there's nothing to delete.
  irrigator_schedule_delete:
    alias: "Irrigator: delete schedule record selected in editor panel"
    sequence:
      - variables:
          picker: "{{ states('input_select.irrigator_schedule_picker') }}"
          idx: "{{ (picker.split(']')[0].split('[')[1] | int) if picker.startswith('[') else -1 }}"
          # Same "build on the still-queued edit if there is one" logic as irrigator_schedule_save.
          records: >-
            {% set pending = (state_attr('sensor.irrigator_command_queue', 'items') or []) | selectattr('topic', 'eq', 'irrigatorF4/cmd/upload/schedule.json') | list %}
            {{ (pending[-1].payload | from_json) if pending else (state_attr('sensor.irrigator_schedule', 'records') or []) }}
      - if:
          - condition: template
            value_template: "{{ idx < 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Irrigator: nothing to delete"
              message: >-
                Pick an existing record from "Schedule Record" first -
                "+ Add new" has nothing to delete.
        else:
          - action: script.irrigator_enqueue_or_publish
            data:
              topic: "irrigatorF4/cmd/upload/schedule.json"
              payload: "{{ (records[:idx] + records[idx+1:]) | tojson }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.irrigator_schedule_picker
            data:
              option: "+ Add new"

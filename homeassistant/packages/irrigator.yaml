      - name: >-
          {{ ('11. ' ~ (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('11', {}).get('name')) if (state_attr('sensor.irrigator_settings', 'Zones') or {}).get('11', {}).get('name') else 'Irrigator Zone 11' }}
        unique_id: irrigator_switch_zone_11
        icon: mdi:sprinkler-variant
        state: "{{ state_attr('sensor.irrigator_watering_state', 'zone') == 11 and (state_attr('sensor.irrigator_watering_state', 'on') | default(false)) }}"
        turn_on:
          - action: script.irrigator_start
            data: {zone: 11, duration: "{{ states('input_number.irrigator_zone_11_duration') | int(5) }}"}
        turn_off:
          - action: script.irrigator_stop

  # Schedule Active: template version of the entity that used to be a plain
  # `mqtt: switch:` (see the NOTE in the `mqtt:` block above). `state:` reads
  # the device's own echo via the read-only sensor added there; writes go
  # through script.irrigator_enqueue_or_publish instead of a raw
  # command_topic so they queue for retry when offline, and it carries no
  # `availability:` so it's never greyed out.
  #
  # Watering Percentage is NOT a sibling of this (despite both being direct
  # MQTT entities historically) - it's now input_number.irrigator_watering_percentage
  # (see `input_number:` below), a plain local helper like every other
  # settings.json field, republished via script.irrigator_publish_settings
  # instead of its own cmd/watering_percentage topic. See that helper's
  # comment for why: cmd/watering_percentage still exists on the firmware
  # side (main.ino's `commandName == "watering_percentage"`) for direct/manual
  # MQTT use, but nothing in this package publishes to it anymore.
  - switch:
      # `name:` deliberately includes the "Irrigator " prefix (matching the
      # pump/zone switches above, not the mqtt: platform's device-linked
      # entities below) - this platform has no `device:` grouping in this
      # file, so entity_id is a plain slugify(name); without the prefix this
      # would register as switch.schedule_active instead of the
      # switch.irrigator_schedule_active every script/automation/dashboard
      # card here already references.
      - name: "Irrigator Schedule Active"
        unique_id: irrigator_schedule_active
        icon: mdi:calendar-check
        state: "{{ is_state('binary_sensor.irrigator_scheduled_state', 'on') }}"
        turn_on:
          - action: script.irrigator_enqueue_or_publish
            data: {topic: "irrigatorF4/cmd/scheduled", payload: "true"}
        turn_off:
          - action: script.irrigator_enqueue_or_publish
            data: {topic: "irrigatorF4/cmd/scheduled", payload: "false"}

      # Master on/off for weather-based auto-adjustment (both the daily percentage recalculation
      # and the rain-skip check) — same template-switch-over-echo-sensor pattern as "Irrigator
      # Schedule Active" above, for the same reason: writes go through
      # script.irrigator_enqueue_or_publish so they queue for retry when offline, and it carries
      # no `availability:` so it's never greyed out.
      #
      # Unlike "Irrigator Schedule Active", the echo topic behind it
      # (binary_sensor.irrigator_auto_adjustment_state / irrigatorF4/auto_adjustment) is NOT
      # retained on the broker (deliberate, see MqttService::publishAutoAdjustmentEnabled), and
      # the device only re-seeds it on its OWN MQTT reconnect. So after an HA-only restart while
      # the device stays connected, that binary_sensor is 'unknown' and this switch would read
      # off even when auto-adjustment is on. Fall back to the auto_adjustment_enabled key of the
      # /status payload, which the "Irrigator - request data" automation re-requests via
      # cmd/status on every HA start / device-reconnect.
      - name: "Irrigator Auto-adjustment"
        unique_id: irrigator_auto_adjustment
        icon: mdi:weather-partly-rainy
        state: >-
          {% set echo = states('binary_sensor.irrigator_auto_adjustment_state') %}
          {% if echo in ['on', 'off'] %}
            {{ echo == 'on' }}
          {% else %}
            {{ state_attr('sensor.irrigator_address_2', 'auto_adjustment_enabled') | default(false, true) }}
          {% endif %}
        turn_on:

  # Offline command queue: any write the device might miss while
  # binary_sensor.irrigator_online is off gets appended here (via the
  # irrigator_queue_push event) instead of published straight away - see
  # script.irrigator_enqueue_or_publish, which is the only thing that ever
  # fires that event, and the "Irrigator - flush pending command queue"
  # automation below, which is the only thing that ever fires
  # irrigator_queue_pop. Self-accumulating trigger-based sensor: each firing
  # reads its own previous `items` attribute via `this.attributes.items`
  # (HA's standard accumulator pattern) and either appends one entry (push)
  # or drops the leading `count` entries once they've actually been
  # published (pop) - so a partial flush (device drops mid-batch) only pops
  # what really went out, leaving the rest for the next retry.
  - trigger:
      - trigger: event
        event_type: irrigator_queue_push
      - trigger: event
        event_type: irrigator_queue_pop
    sensor:
      - name: "Irrigator Command Queue"
        unique_id: irrigator_command_queue
        icon: mdi:playlist-clock
        unit_of_measurement: "items"
        state: >-
          {% set prev = this.attributes.items | default([]) %}
          {% if trigger.event.event_type == 'irrigator_queue_push' %}
            {{ (prev + [trigger.event.data]) | length }}
          {% else %}
            {{ (prev[trigger.event.data.count | default(0):]) | length }}
          {% endif %}
        attributes:
          items: >-
            {% set prev = this.attributes.items | default([]) %}
            {% if trigger.event.event_type == 'irrigator_queue_push' %}
              {{ prev + [{'topic': trigger.event.data.topic, 'payload': trigger.event.data.payload}] }}
            {% else %}
              {{ prev[trigger.event.data.count | default(0):] }}
            {% endif %}

  # Current schedule.json representation. Fed by two topics so it's always
  # up to date regardless of source: `.../schedule` (the device pushes this
  # on every change - HA upload, or the device's own rotary/display menu)
  # and `.../download/schedule.json` (the one-shot response to the
  # virgin-deploy request in irrigator_automations.yaml). Whichever arrives
  # last wins, which is exactly "update current schedule.json on arrival".
  # Its `records` attribute also feeds the "Device Schedule" table and the
  # schedule editor panel on the Schedule tab (see script.irrigator_schedule_save
  # / script.irrigator_schedule_delete and the "Irrigator - rebuild schedule
  # editor dropdown options" / "...load selected schedule record..."
  # automations in irrigator_automations.yaml).
  - trigger:
      - trigger: mqtt
        topic: "irrigatorF4/schedule"
      - trigger: mqtt
        topic: "irrigatorF4/download/schedule.json"
    sensor:
      - name: "Irrigator Schedule"
        unique_id: irrigator_schedule
        icon: mdi:calendar-sync
        state: "{{ trigger.payload_json | length }} records"
        attributes:
          records: "{{ trigger.payload_json }}"

  # Weather-based auto-adjustment: read-only display of whatever
  # settings.json currently has - sourced straight from the same full-snapshot
  # sensor.irrigator_settings every other read-only field already uses, no new MQTT wiring needed.
  # NOTE: there is deliberately no "last update" equivalent here - that date is in-RAM only on the
  # device (never written to settings.json, see Settings.h), so HA has no way to know it; the
  # device's own rotary UI Settings menu is the only place it's shown.
  - sensor:
      - name: "Irrigator City"
        unique_id: irrigator_city
        icon: mdi:map-marker-outline
        state: "{{ (state_attr('sensor.irrigator_settings', 'Location') or {}).get('city') or '-' }}"
      - name: "Irrigator Coordinates"
        unique_id: irrigator_coordinates
        icon: mdi:crosshairs-gps
        state: >-
          {% set location = state_attr('sensor.irrigator_settings', 'Location') or {} %}
          {% if location.get('location_known') %}
            {{ '%.4f' | format(location.get('latitude', 0) | float(0)) }}, {{ '%.4f' | format(location.get('longitude', 0) | float(0)) }}
          {% else %}
            -
          {% endif %}
      # valve/pump_current_base_level live under settings.json's Current_sensor group (see
      # Settings.h), not as a top-level attribute of sensor.irrigator_settings - the stock
      # `entities` card's `type: attribute` row can only read a literal top-level attribute, and
      # has no `type: template` row (that's a full CARD type, not a row type - using it as a row
      # renders "Configuration error" in Lovelace). Same fix as City/Coordinates above: a small
      # derived sensor, referenced as a plain entity row in garden_tab.yaml.
      - name: "Irrigator Valve Base Level"
        unique_id: irrigator_valve_base_level
        icon: mdi:tune-variant
        state: >-
          {{ (state_attr('sensor.irrigator_settings', 'Current_sensor') or {}).get('valve_current_base_level', 0) }}
      - name: "Irrigator Pump Base Level"
        unique_id: irrigator_pump_base_level
        icon: mdi:tune-variant
        state: >-
          {{ (state_attr('sensor.irrigator_settings', 'Current_sensor') or {}).get('pump_current_base_level', 0) }}

      # "Last update date/time" row of the "Auto-adjustment by the Weather" card. `last_weather_update`
      # is a top-level key of the /status payload (main.ino's buildStatusJson), an ISO string in
      # naive UTC that the device omits entirely until its first successful weather fetch THIS
      # session - so this reads `unknown` after a device reboot until the next daily auto-adjustment
      # run lands. device_class: timestamp makes the entities-card row render it as relative age
      # ("2 hours ago") with the absolute time on hover; "+00:00" is appended so the tz-naive value
      # parses as the UTC instant it actually is (same trick as the pump-remaining sensors above).
      - name: "Irrigator Last Weather Update"
        unique_id: irrigator_last_weather_update
        device_class: timestamp
        icon: mdi:weather-partly-rainy
        state: >-
          {% set t = state_attr('sensor.irrigator_address_2', 'last_weather_update') %}
          {% if t %}{{ (t ~ '+00:00') | as_datetime }}{% endif %}

      # "Last decision" row of the "Auto-adjustment by the Weather" card. Per the two topics the
      # device publishes its auto-adjustment outcome on:
      #   - /skip_rain_until wins WHILE its timestamp is still in the future -> "Skip until <local>"
      #   - once that instant has passed (or no skip was ever issued) -> "Set to X%" from the
      #     retained /watering_percentage echo (sensor.irrigator_watering_percentage_echo).
      # now() in the template makes HA re-evaluate this once a minute, so it flips from the skip
      # text to the percentage text on its own the moment the skip window closes - no automation.
      - name: "Irrigator Last Decision"
        unique_id: irrigator_last_decision
        icon: mdi:scale-balance
        state: >-
          {% set skip = states('sensor.irrigator_rain_skip_until') %}
          {% set skip_dt = (skip ~ '+00:00') | as_datetime(none)
             if skip not in ['unknown', 'unavailable', 'none', '', none] else none %}
          {% if skip_dt is not none and skip_dt > now() %}
            Skip until {{ skip_dt | as_timestamp | timestamp_custom('%a %d %b %H:%M', true) }}
          {% else %}
            {% set pct = states('sensor.irrigator_watering_percentage_echo') %}
            {% if pct in ['unknown', 'unavailable', '', none] %}
              {% set pct = states('sensor.irrigator_settings') %}
            {% endif %}
            {% if pct in ['unknown', 'unavailable', '', none] %}
              Set to ?%
            {% else %}
              Set to {{ pct | int }}%
            {% endif %}
          {% endif %}

  - button:
      # Formerly "Irrigator Refresh From Device" - same entity (unique_id unchanged, so no
      # existing automation/dashboard reference to it breaks), renamed because it now does more
      # than refresh HA's live sensors: it also writes settings.json/schedule.json to
      # /config/irrigator_backups/ - see script.irrigator_backup_from_device's comment.
      - name: "Backup from the Irrigator Device"
        unique_id: irrigator_refresh_from_device
        icon: mdi:cloud-download-outline
        press:
          - action: script.irrigator_backup_from_device
      # Uploads the backup files the button above last wrote back to the device - see
      # script.irrigator_restore_from_backup's comment for exactly what is and isn't restored.
      # NOTE: this entity's entity_id is button.restore_to_the_irrigator_device (slugified from
      # `name:` below), NOT button.<unique_id> - `unique_id:` only pins the registry entry across
      # restarts for a template entity with no `device:` link like this one; it plays no part in
      # entity_id generation. Don't "fix" the dashboard/docs references back to
      # button.irrigator_restore_from_backup without also renaming this entity in the UI first.
      - name: "Restore to the Irrigator Device"
        unique_id: irrigator_restore_from_backup
        icon: mdi:cloud-upload-outline
        press:
          - action: script.irrigator_restore_from_backup
      - name: "Irrigator Save Schedule Record"
        unique_id: irrigator_schedule_save_button
        icon: mdi:content-save-outline
        press:
          - action: script.irrigator_schedule_save
      - name: "Irrigator Delete Schedule Record"
        unique_id: irrigator_schedule_delete_button
        icon: mdi:trash-can-outline
        press:
          - action: script.irrigator_schedule_delete
      - name: "Irrigator Test All"
        unique_id: irrigator_test_all_button
        icon: mdi:play-circle-outline
        press:
          - action: script.irrigator_test_all
      - name: "Irrigator Stop All"
        unique_id: irrigator_stop_all_button
        icon: mdi:stop-circle-outline
        press:
          - action: script.irrigator_stop_all
      # Requires an actual watering run (valve open, not just the pump alone) to be in progress -
      # the device rejects it with /alert otherwise (see sensor.irrigator_last_alert). See
      # docs/technical.md's "cmd/calibrate" section.
      - name: "Irrigator Calibrate"
        unique_id: irrigator_calibrate_button
        icon: mdi:tune-variant
        press:
          - action: script.irrigator_calibrate

# -----------------------------------------------------------------------
# Manual-run duration sliders (1-120 min), one per pump/zone card.
# -----------------------------------------------------------------------
input_number:
  irrigator_pump_duration:
    name: "Pump Duration"
    icon: mdi:timer-outline
    min: 1
    max: 120
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5

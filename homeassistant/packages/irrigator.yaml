    icon: mdi:clock-outline
    has_date: false
    has_time: true

# -----------------------------------------------------------------------
# Settings tab: editable zone name + enabled checkbox. Both lack a
# dedicated device-side merge topic, so any change here republishes the
# FULL settings.json (see script.irrigator_publish_settings) - the
# firmware's cmd/upload/settings.json replaces the whole object and fills
# missing fields with factory defaults, so a partial payload would silently
# reset everything else. `initial:` here is only what's shown before the
# first device sync ever completes - "Irrigator - sync device settings to
# local helpers" (irrigator_automations.yaml) overwrites it with the real
# name/flag from the device the moment sensor.irrigator_settings gets data.
# -----------------------------------------------------------------------
input_text:

  irrigator_zone_1_enabled: {name: "Zone 1 Enabled", icon: mdi:check-circle-outline}
  irrigator_zone_2_enabled: {name: "Zone 2 Enabled", icon: mdi:check-circle-outline}
  irrigator_zone_3_enabled: {name: "Zone 3 Enabled", icon: mdi:check-circle-outline}
  irrigator_zone_4_enabled: {name: "Zone 4 Enabled", icon: mdi:check-circle-outline}
  irrigator_zone_5_enabled: {name: "Zone 5 Enabled", icon: mdi:check-circle-outline}

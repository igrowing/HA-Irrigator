  - type: sections
    max_columns: 4
    title: Garden
    path: garden
    icon: mdi:sprinkler-variant
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status & Manual Control
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.irrigator_command_queue
                above: 0
            card:
              type: tile
              entity: sensor.irrigator_command_queue
              name: Pending Commands (waiting to reach the device)
              icon: mdi:playlist-clock
              color: orange
          # Pump + each zone: switch and remaining time in an entities card, with the manual-run
          # Duration as its own tile below (numeric-input feature = a "- N +" stepper, nicer and
          # easier to nudge than a plain mode:box row) - the two wrapped in a vertical-stack so
          # each pump/zone still reads as one grouped unit. The Duration tile references the same
          # input_number.irrigator_*_duration helpers as before; only the presentation changed.
          - type: vertical-stack
            cards:
              - type: entities
                title: Pump
                entities:
                  - entity: switch.irrigator_pump
                  - entity: sensor.irrigator_pump_remaining
                    name: Remaining
                show_header_toggle: false
                state_color: true
              - type: tile
                entity: input_number.irrigator_pump_duration
                name: Duration (min)
                features:
                  - type: numeric-input
                    style: buttons
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.irrigator_zone_1_enabled_sensor
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: entities
                  entities:
                    - entity: switch.irrigator_zone_1
                    - entity: sensor.irrigator_zone_1_remaining
                      name: Remaining
                  state_color: true
                - type: tile
                  entity: input_number.irrigator_zone_1_duration
                  name: Duration (min)
                  features:
                    - type: numeric-input
                      style: buttons
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.irrigator_zone_2_enabled_sensor
                state: "on"
            card:

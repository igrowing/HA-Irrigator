                icon: mdi:content-save-outline
                color: green
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.irrigator_save_schedule_record
              - type: tile
                entity: button.irrigator_delete_schedule_record
                name: Delete Record
                icon: mdi:trash-can-outline
                color: red
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.irrigator_delete_schedule_record
                  confirmation:
                    text: Delete the selected schedule record?

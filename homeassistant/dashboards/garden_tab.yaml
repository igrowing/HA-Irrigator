      - type: grid
        cards:
          - type: heading
            heading: Watering History (7 days)
          - type: history-graph
            title: Watering History
            hours_to_show: 168
            entities:
              - entity: switch.irrigator_pump
              - entity: switch.irrigator_zone_1
              - entity: switch.irrigator_zone_2
              - entity: switch.irrigator_zone_3
              - entity: switch.irrigator_zone_4
              - entity: switch.irrigator_zone_5
              - entity: switch.irrigator_zone_6
              - entity: switch.irrigator_zone_7
              - entity: switch.irrigator_zone_8
              - entity: switch.irrigator_zone_9
              - entity: switch.irrigator_zone_10
          - type: tile
            entity: sensor.irrigator_flow_total
            grid_options:
              columns: full
              rows: 1
          # 24H = rolling trailing 24h (statistics sensors, irrigator.yaml); Total = persistent
          # lifetime accumulators (*_water_lifetime, irrigator.yaml) - NOT the device's own counters,
          # which restart at 0 on every device reboot. A sensor that isn't available (e.g. the
          # statistics sensors before HA has been fully restarted) shows "n/a" rather than a
          # misleading 0. Disabled zones are omitted; "Other" (flow measured while every valve is
          # closed) is always listed. Same table style as Device Schedule above.
          - type: markdown
            title: Water Consumption
            content: >-
              {%- set zone_names = state_attr('sensor.irrigator_settings',
              'Zones') or {} -%} {%- set ns = namespace(h24=0, tot=0, rows=[])
              -%} {%- for n in range(1, 12) -%} {%- if
              is_state('binary_sensor.irrigator_zone_' ~ n ~
              '_enabled_sensor', 'on') -%} {%- set ns.rows = ns.rows + [{'z':
              n, 'name': zone_names.get(n | string, {}).get('name', '(no
              name)'), 'd': states('sensor.irrigator_zone_' ~ n ~
              '_water_24h'), 't': states('sensor.irrigator_zone_' ~ n ~
              '_water_lifetime')}] -%} {%- endif -%} {%- endfor -%} {%- set
              ns.rows = ns.rows + [{'z': '-', 'name': 'Other', 'd':
              states('sensor.irrigator_other_water_24h'), 't':
              states('sensor.irrigator_other_water_lifetime')}] -%}

              | Zone | Name | 24H (L) | Total (L) |

              |---|---|---|---|

              {%- for r in ns.rows %}

              | {{ r.z }} | {{ r.name }} | {{ r.d | float | round(1) if r.d |
              is_number else 'n/a' }} | {{ r.t | float | round(1) if r.t |
              is_number else 'n/a' }} |

              {%- if r.d | is_number %}{% set ns.h24 = ns.h24 + r.d | float
              %}{% endif -%} {%- if r.t | is_number %}{% set ns.tot = ns.tot +
              r.t | float %}{% endif -%} {%- endfor %}

              | | **Total** | **{{ ns.h24 | round(1) }}** | **{{ ns.tot |
              round(1) }}** |
      - type: grid
        cards:
          - type: heading
            heading: Schedule
          - type: tile
            entity: input_select.irrigator_schedule_sort_by
            icon: mdi:sort
          - type: tile
            entity: switch.irrigator_schedule_active
          - type: markdown
            title: Device Schedule (last known)
            content: >-
              {%- set day_names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
              -%} {%- set zone_names = state_attr('sensor.irrigator_settings',
              'Zones') or {} -%} {%- set recs =
              state_attr('sensor.irrigator_schedule', 'records') or [] -%} {%-
              set sort_key = states('input_select.irrigator_schedule_sort_by')
              -%} {%- set ns = namespace(items=[]) -%} {%- for r in recs -%} {%-
              set zname = zone_names.get(r.zone | string, {}).get('name', '#' ~
              r.zone ~ ' (no name)') -%} {%- set tagged = r | combine({'_idx':
              loop.index0, '_name': zname, '_day': day_names[r.day_of_week -
              1]}) -%} {%- set ns.items = ns.items + [tagged] -%} {%- endfor -%}
              {%- if sort_key == 'Zone' -%} {%- set sorted_items = ns.items |
              sort(attribute='zone') -%} {%- elif sort_key == 'Name' -%} {%- set
              sorted_items = ns.items | sort(attribute='_name') -%} {%- elif
              sort_key == 'Start' -%} {%- set sorted_items = ns.items |
              sort(attribute='start_time') -%} {%- elif sort_key == 'Duration'
              -%} {%- set sorted_items = ns.items |
              sort(attribute='duration_min') -%} {%- elif sort_key == 'Active'
              -%} {%- set sorted_items = ns.items | sort(attribute='active') -%}
              {%- else -%} {%- set sorted_items = ns.items |
              sort(attribute='day_of_week') -%} {%- endif -%} {%- if
              sorted_items | length == 0 -%} No schedule currently loaded on the
              device. {%- else -%}

              | Num | Zone | Name | Day | Start | Duration | Active | 

              |---|---|---|---|---|---|---|   

              {%- for r in sorted_items %}     

              | {{ r._idx }} | {{ r.zone }} | {{ r._name }} | {{ r._day }} | {{
              r.start_time }} | {{ r.duration_min }} min | {{ 'yes' if r.active
              else 'no' }} |  

              {%- endfor -%}   

              {%- endif %}
          - type: entities
            title: Edit Schedule Record
            entities:
              - entity: input_select.irrigator_schedule_picker
                name: Schedule Record
              - entity: input_select.irrigator_edit_zone
                name: Zone
              - entity: input_select.irrigator_edit_day
                name: Day
              - entity: input_datetime.irrigator_edit_start_time
                name: Start Time
              - entity: input_number.irrigator_edit_duration_min

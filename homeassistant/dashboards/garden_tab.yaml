                  name: History
                  icon: mdi:history
                  vertical: false
                  tap_action:
                    action: more-info
          # "Other" is unconditional - not tied to any single zone's enabled flag (see
          # FlowLifetimeCounters' class comment: it's flow measured while every valve is closed).

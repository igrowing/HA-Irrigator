          - type: heading
            heading: Water Consumption
          # Lifetime (since-boot) liters per zone, one conditional card per enabled zone - same
          # enabled-sensor-gated pattern as the Status & Manual Control section's per-zone cards
          # above. `type: statistic` reads HA's own long-term statistics for the underlying
          # total_increasing sensor (see irrigator.yaml), which is what makes the rolling 24h
          # window reliable across a device reboot resetting the RAM-only counter back to 0.
          #
          # NOTE: `period: {rolling_window: {duration: {hours: 24}}}` needs a fairly recent Home
          # Assistant release - confirm it's available on yours (the statistic card's period
          # options have evolved across releases). If it's not, fall back to
          # `period: {calendar: {period: day}}` instead ("since local midnight" rather than a
          # strict trailing 24h).
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.irrigator_zone_1_enabled_sensor
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: statistic
                  entity: sensor.irrigator_zone_1_water_total
                  name: Zone 1 (24h)
                  stat_type: change
                  period:
                    rolling_window:
                      duration:
                        hours: 24
                - type: tile
                  entity: sensor.irrigator_zone_1_water_total
                  name: History
                  icon: mdi:history
                  vertical: false

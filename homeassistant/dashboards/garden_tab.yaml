              - entity: input_boolean.irrigator_zone_11_enabled
                name: Enabled
          - type: entities
            title: Current-Sensor Calibration
            entities:
              # valve/pump_current_base_level live under settings.json's Current_sensor group now
              # (see Settings.h) - the stock `entities` card's `type: attribute` row can't drill
              # into a nested attribute (and `type: template` is a full CARD type, not a row type -
              # using it as a row here previously rendered "Configuration error"), so these are
              # plain entity rows pointing at the two derived template sensors in irrigator.yaml
              # instead.
              - entity: sensor.irrigator_valve_base_level
                name: Valve Base Level
              - entity: sensor.irrigator_pump_base_level
                name: Pump Base Level
              - entity: sensor.irrigator_calibration_result
                name: Last Calibration Response
              # Only meaningful once the corresponding sensor is calibrated (base level above is
              # nonzero) - see Settings::alertPumpUc/etc and drainCurrentBurstResults() in main.ino.
              - entity: input_boolean.irrigator_alert_pump_uc
                name: Alert Pump Under-current
              - entity: input_boolean.irrigator_alert_pump_oc
                name: Alert Pump Over-current
              - entity: input_boolean.irrigator_alert_valve_uc
                name: Alert Valve Under-current

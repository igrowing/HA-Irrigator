          - type: tile
            entity: button.irrigator_test_all
            icon: mdi:play-circle-outline
            color: green
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigator_test_all
          - type: tile
            entity: button.irrigator_stop_all
            icon: mdi:stop-circle-outline
            color: red
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigator_stop_all
              confirmation:
                text: "Stop watering now?"
      - type: grid
        cards:
          - type: heading
            heading: Watering History (7 days)
          - type: history-graph
            title: Watering History
            hours_to_show: 168
            entities:
              - entity: switch.irrigator_pump
              - entity: switch.irrigator_zone_1
              - entity: switch.irrigator_zone_2
              - entity: switch.irrigator_zone_3
              - entity: switch.irrigator_zone_4
              - entity: switch.irrigator_zone_5
              - entity: switch.irrigator_zone_6
              - entity: switch.irrigator_zone_7
              - entity: switch.irrigator_zone_8
              - entity: switch.irrigator_zone_9
              - entity: switch.irrigator_zone_10
      - type: grid
        cards:
          - type: heading
            heading: Schedule
          - type: tile
            entity: input_select.irrigator_schedule_sort_by
            icon: mdi:sort
          - type: tile
            entity: switch.irrigator_schedule_active
          - type: markdown
            title: Device Schedule (last known)
            content: >-
              {%- set day_names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] -%}
              {%- set zone_names = state_attr('sensor.irrigator_settings', 'zone_names') or {} -%}
              {%- set recs = state_attr('sensor.irrigator_schedule', 'records') or [] -%}
              {%- set sort_key = states('input_select.irrigator_schedule_sort_by') -%}
              {%- set ns = namespace(items=[]) -%}
              {%- for r in recs -%} {%- set zname = zone_names.get(r.zone | string, {}).get('name', '#' ~ r.zone ~ ' (no name)') -%} {%- set tagged = r | combine({'_idx': loop.index0, '_name': zname, '_day': day_names[r.day_of_week - 1]}) -%} {%- set ns.items = ns.items + [tagged] -%} {%- endfor -%}
              {%- if sort_key == 'Zone' -%} {%- set sorted_items = ns.items | sort(attribute='zone') -%} {%- elif sort_key == 'Name' -%} {%- set sorted_items = ns.items | sort(attribute='_name') -%} {%- elif sort_key == 'Start' -%} {%- set sorted_items = ns.items | sort(attribute='start_time') -%} {%- elif sort_key == 'Duration' -%} {%- set sorted_items = ns.items | sort(attribute='duration_min') -%} {%- elif sort_key == 'Active' -%} {%- set sorted_items = ns.items | sort(attribute='active') -%} {%- else -%} {%- set sorted_items = ns.items | sort(attribute='day_of_week') -%} {%- endif -%}
              {%- if sorted_items | length == 0 -%}
              No schedule currently loaded on the device.
              {%- else -%}

              | Num | Zone | Name | Day | Start | Duration | Active | 

              |---|---|---|---|---|---|---|   

              {%- for r in sorted_items %}     

              | {{ r._idx }} | {{ r.zone }} | {{ r._name }} | {{ r._day }} | {{
              r.start_time }} | {{ r.duration_min }} min | {{ 'yes' if r.active
              else 'no' }} |  

              {%- endfor -%}   

              {%- endif %}
          - type: entities
            title: Edit Schedule Record
            entities:
              - entity: input_select.irrigator_schedule_picker
                name: "Schedule Record"
              - entity: input_select.irrigator_edit_zone
                name: "Zone"
              - entity: input_select.irrigator_edit_day
                name: "Day"
              - entity: input_datetime.irrigator_edit_start_time
                name: "Start Time"
              - entity: input_number.irrigator_edit_duration_min
                name: "Duration (min)"
              - entity: input_boolean.irrigator_edit_active
                name: "Active"
          - type: horizontal-stack
            cards:
              - type: tile
                entity: button.irrigator_save_schedule_record
                name: Save Record
                icon: mdi:content-save-outline
                color: green
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.irrigator_save_schedule_record
              - type: tile
                entity: button.irrigator_delete_schedule_record
                name: Delete Record
                icon: mdi:trash-can-outline
                color: red
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.irrigator_delete_schedule_record
                  confirmation:
                    text: "Delete the selected schedule record?"

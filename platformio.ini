; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

; native is test-only: it has no entry point (build_src_filter only pulls in domain/, and
; test_build_src's Unity main() is only linked in by `pio test`), so a plain `pio run` on it
; fails to link ("undefined reference to WinMain/main"). default_envs keeps a bare `pio run` /
; the IDE's generic "build" task scoped to the real target; run native explicitly with
; `pio test -e native`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
; platform = espressif32
; Use stable zip for pioarduino instead of ready framework of platformio
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17

board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = src/partitions.csv
lib_ldf_mode = deep+
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	; -DAPP_VERSION=\"0.1.0\"
    ; Ensure framework Network library headers are found when compiling framework libs
    -IC:/Users/igory/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
    ; Warns (build-time, every `pio run`) whenever a single function's own stack frame exceeds
    ; 2KB — the class of bug that caused the v1.1.5 reboot loop (a WateringRequest[255] array left
    ; on the stack in a function called every loop() iteration, ~1.5KB, invisible to `pio test
    ; -e native` since that suite doesn't even compile main.ino, and wouldn't overflow a host
    ; process's megabyte-plus stack even if it did — see runScheduleEngine()'s dueRequests comment
    ; in main.ino). Warning, not -Werror: src/main.ino's handleMqttCommand() already legitimately
    ; runs ~4KB (a long command dispatch, called rarely, not from the tight loop() path) — if this
    ; warning ever fires on a function actually reachable from loop() (loop() itself,
    ; runScheduleEngine, drainCurrentBurstResults, updateOutputsFromDomain, updateCurrentSampling,
    ; sampleWifiRssiIfDue/sampleNoiseFloorIfDue, tryGeolocateIfDue/runAutoAdjustmentIfDue), that's
    ; the real danger signal — those run on every tick and share the same ~8KB default ESP32
    ; Arduino task stack with everything else.
    -Wstack-usage=2048
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	sstaub/Ticker@^4.4.0
	mathertel/RotaryEncoder@^1.6.0
	lennarthennigs/Button2@^2.5.0
	olikraus/U8g2@^2.36.15

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Iinclude
build_src_filter =
	+<domain/>
	-<drivers/>
	-<network/>
	-<ui/>
	-<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
test_build_src = yes
extra_scripts = pre:pio_override_native_toolchain.py

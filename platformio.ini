; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; platform = espressif32
; Use stable zip for pioarduino instead of ready framework of platformio
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform_packages = platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = src/partitions.csv
lib_ldf_mode = deep+
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-DAPP_VERSION=\"0.1.0\"
    ; Ensure framework Network library headers are found when compiling framework libs
    -IC:/Users/igory/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	sstaub/Ticker@^4.4.0
	mathertel/RotaryEncoder@^1.6.0
	lennarthennigs/Button2@^2.5.0
	olikraus/U8g2@^2.36.15

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Iinclude
build_src_filter =
	+<domain/>
	-<drivers/>
	-<network/>
	-<ui/>
	-<main.cpp>
test_build_src_filter =
    +<domain/>
    -<drivers/>
    -<network/>
    -<ui/>
extra_scripts = pre:pio_override_native_toolchain.py
